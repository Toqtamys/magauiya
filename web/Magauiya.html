<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Magauiya: ver. inner peace 1.0 C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Лабораторный инструмент: слева — загрузка и параметры, справа — результаты.
   Акцент — фиолетовые «чернила» сетки камеры Маклера; классы ВОЗ — своя семантическая палитра. */
:root{
  --paper:#f5f5f8; --panel:#ffffff; --ink:#1c1a2b; --muted:#68657a; --line:#e2e0ea; --soft:#efedf6;
  --accent:#4a2f9e; --accent-ink:#ffffff; --accent-soft:#ebe6fb;
  --a:#2b8a3e; --b:#d99a00; --c:#1971c2; --d:#c2255c; --x:#9a98a6;
  --low:#c92a2a; --low-bg:#fff0f0; --ok:#2b8a3e;
  --cat:#e9a15b; --cat-dark:#b9692c; --cat-belly:#fbe3c4; --scope:#3d3a52; --scope-light:#8f8ba8;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --panel:#1b1a25; --ink:#ecebf4; --muted:#a19eb4; --line:#2e2c3c; --soft:#22202e;
  --accent:#a48cff; --accent-ink:#17142a; --accent-soft:#2a2445;
  --a:#51cf66; --b:#fcc419; --c:#4dabf7; --d:#f06595; --x:#7d7a8c;
  --low:#ff8787; --low-bg:#3a1f25; --ok:#69db7c; --scope:#c9c5e0; --scope-light:#7d7998; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121119; --panel:#1b1a25; --ink:#ecebf4; --muted:#a19eb4; --line:#2e2c3c; --soft:#22202e;
  --accent:#a48cff; --accent-ink:#17142a; --accent-soft:#2a2445;
  --a:#51cf66; --b:#fcc419; --c:#4dabf7; --d:#f06595; --x:#7d7a8c;
  --low:#ff8787; --low-bg:#3a1f25; --ok:#69db7c; --scope:#c9c5e0; --scope-light:#7d7998; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--f-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{width:84px;height:70px;flex:none}
.brand h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15}
.brand h1 .ver{display:block;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13.5px;flex:1 1 320px;min-width:0}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.langs button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--panel);color:var(--muted);padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pct{margin-top:16px}
.pct h4{font-size:14px;margin:0 0 4px}
.pct p.lead{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.gauge{display:block;width:100%;max-width:170px;height:18px}
.concl{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:13.5px}
.concl b{display:block;margin-bottom:3px}
.concl.warn{background:var(--low-bg)}
.concl small{display:block;color:var(--muted);margin-top:6px;font-size:12px}
footer.contact{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13.5px;color:var(--muted)}
footer.contact .mail{font-family:var(--f-num);color:var(--ink);user-select:all}

.layout{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.side{position:static}}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
/* зона загрузки — сетка 10×10 как в камере Маклера */
.drop{display:block;position:relative;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;
  background-color:var(--soft);
  background-image:linear-gradient(color-mix(in srgb,var(--accent) 14%,transparent) 1.5px,transparent 1.5px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent) 1.5px,transparent 1.5px);
  background-size:22px 22px;background-position:-1px -1px;transition:border-color .15s,background-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background-color:var(--accent-soft)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop strong{display:block;font-size:15px;margin-bottom:2px}
.drop small{color:var(--muted)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:13.5px}
.file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .st{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;gap:8px;align-items:center}
.file .vol{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.file .vol input{width:62px;padding:3px 6px;font-size:12.5px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:1}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.rm:hover{color:var(--ink);background:var(--soft)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.full{grid-column:1/-1}
input[type=number],input[type=text],select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.btn{font:inherit;font-weight:600;font-size:14.5px;border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);width:auto;padding:7px 12px;font-size:13px}
.btn.ghost:hover{background:var(--accent-soft)}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin-top:8px}
.status.err{color:var(--low)}
/* результаты */
.results{display:flex;flex-direction:column;gap:18px;min-width:0}
.sumhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sumhead h2{margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12px;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{font-family:var(--f-ui)}
td.low{color:var(--low);background:var(--low-bg);font-weight:600}
.legend-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card h3{font-size:15.5px;font-weight:600;margin:0;word-break:break-all}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--low-bg);color:var(--low)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:end;margin:14px 0 16px}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-num);font-size:40px;font-weight:500;letter-spacing:-1px;line-height:1.1}
.big small{font-family:var(--f-ui);font-size:15px;color:var(--muted);letter-spacing:0;font-weight:500}
.sub{font-size:13px;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 9px;background:var(--line)}
.bar span{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.keys b{font-family:var(--f-num);font-weight:500}
.hist svg{display:block;width:100%;height:auto;color:var(--muted)}
.player{position:relative;border-radius:8px;overflow:hidden;background:#000;margin:4px 0 14px;max-width:100%}
.player video,.player canvas{display:block;width:100%;height:auto}
.player canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ptools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.ptools label{display:flex;gap:6px;align-items:center;cursor:pointer}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.kv th{width:200px;color:var(--muted);font-weight:500;font-size:13px}
.kv td{font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note p{margin:0 0 8px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
    <svg viewBox="0 0 132 110" role="img" aria-label="Толстый кот смотрит в микроскоп">
      <!-- микроскоп -->
      <rect x="84" y="98" width="42" height="8" rx="3" fill="var(--scope)"/>
      <rect x="110" y="44" width="8" height="56" rx="3" fill="var(--scope)"/>
      <rect x="86" y="74" width="30" height="5" rx="2" fill="var(--scope-light)"/>
      <circle cx="97" cy="80" r="3" fill="var(--accent)"/>
      <g transform="rotate(-28 100 52)">
        <rect x="90" y="30" width="13" height="40" rx="4" fill="var(--scope)"/>
        <rect x="93" y="68" width="7" height="8" rx="2" fill="var(--scope-light)"/>
        <rect x="88" y="22" width="17" height="10" rx="3" fill="var(--scope)"/>
      </g>
      <path d="M118 52 q-8 -6 -16 -2" stroke="var(--scope)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- хвост -->
      <path d="M14 92 q-14 -6 -6 -22 q5 -9 13 -4" stroke="var(--cat-dark)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- тело -->
      <ellipse cx="42" cy="80" rx="33" ry="27" fill="var(--cat)"/>
      <ellipse cx="50" cy="88" rx="17" ry="15" fill="var(--cat-belly)"/>
      <path d="M22 66 q5 4 3 10 M30 58 q5 5 2 11 M16 78 q6 3 5 9" stroke="var(--cat-dark)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- лапы -->
      <ellipse cx="36" cy="104" rx="9" ry="5" fill="var(--cat)"/>
      <ellipse cx="60" cy="104" rx="9" ry="5" fill="var(--cat)"/>
      <ellipse cx="72" cy="78" rx="7" ry="5" fill="var(--cat)" transform="rotate(-30 72 78)"/>
      <!-- голова -->
      <circle cx="68" cy="46" r="20" fill="var(--cat)"/>
      <path d="M52 36 l-3 -17 l13 10 z" fill="var(--cat)"/><path d="M53 33 l-2 -9 l7 6 z" fill="var(--cat-belly)"/>
      <path d="M70 27 l9 -13 l3 16 z" fill="var(--cat)"/>
      <path d="M58 33 q3 5 0 9 M65 28 q2 4 0 7" stroke="var(--cat-dark)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="55" rx="10" ry="7" fill="var(--cat-belly)"/>
      <!-- прищуренный глаз и глаз у окуляра -->
      <path d="M60 46 q3 2 6 0" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="79" cy="42" r="2.2" fill="var(--ink)"/>
      <path d="M68 54 l3 2 l3 -2" stroke="var(--ink)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M60 55 h-9 M60 58 l-8 2 M80 56 h7" stroke="var(--cat-dark)" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
      <h1>Magauiya<span class="ver">ver. inner peace 1.0 C</span></h1>
    </div>
    <p data-i18n="tagline"></p>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="kk">Қаз</button><button type="button" data-lang="ru">Рус</button><button type="button" data-lang="en">Eng</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <section class="panel" aria-labelledby="h-files">
        <p class="eyebrow" id="h-files" data-i18n="stepVideo"></p>
        <label class="drop" id="drop" tabindex="0">
          <input type="file" id="fileInput" accept="video/*,.mp4,.mov,.m4v" multiple data-i18n-aria="dropTitle">
          <strong data-i18n="dropTitle"></strong>
          <small data-i18n="dropSub"></small>
        </label>
        <div class="files" id="files"></div>
      </section>

      <section class="panel" aria-labelledby="h-set">
        <p class="eyebrow" id="h-set" data-i18n="stepChamber"></p>
        <div class="form">
          <label><span data-i18n="depth"></span><input type="number" id="depth" value="10" min="1" step="1"></label>
          <label><span data-i18n="pitch"></span><input type="number" id="pitch" value="100" min="1" step="1"></label>
          <label><span data-i18n="dilution"></span><input type="number" id="dilution" value="1" min="1" step="0.5"></label>
          <label><span data-i18n="umpx"></span><input type="text" id="umpx" data-i18n-ph="umpxPh" inputmode="decimal"></label>
        </div>
        <p class="hint" data-i18n="chamberHint"></p>
      </section>

      <section class="panel">
        <button class="btn" id="run" disabled></button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
    </aside>

    <main class="results" id="results"></main>
  </div>
  <footer class="contact">
    <span><span data-i18n="feedback"></span>:</span> <b>Alikhan Magauiya</b>
    <a class="mail" href="mailto:orda.ezhenid@gmail.com">orda.ezhenid@gmail.com</a>
    <button class="btn ghost" id="copyMail" type="button" data-i18n="copyEmail"></button>
    <span id="mailStatus" class="status" role="status" aria-live="polite"></span>
  </footer>
</div>

// ------------------------------------------------------------------ процентили ВОЗ 2021
// Campbell et al., Andrology 2021 (ВОЗ, 6-е изд.): мужчины, у партнёрш которых беременность наступила ≤ 12 мес.
const WHO_PCT = [2.5, 5, 10, 25, 50, 75, 90, 95, 97.5];
const WHO_DIST = {
  volume: [1.0, 1.4, 1.8, 2.3, 3.0, 4.2, 5.5, 6.2, 6.9],
  conc:   [11, 16, 22, 36, 66, 110, 166, 208, 254],
  total:  [29, 39, 58, 108, 210, 363, 561, 701, 865],
  tm:     [35, 42, 47, 55, 64, 73, 83, 90, 92],
  pr:     [24, 30, 36, 45, 55, 63, 71, 77, 81],
  np:     [1, 1, 2, 4, 8, 15, 26, 32, 38],
  im:     [15, 20, 23, 30, 37, 45, 53, 58, 65],
};
function whoPercentile(key, v) {
  const d = WHO_DIST[key]; if (v == null || !isFinite(v)) return null;
  if (v < d[0]) return -1; if (v > d[d.length - 1]) return 101;
  for (let i = 0; i < d.length - 1; i++) {
    if (v <= d[i + 1]) { if (d[i + 1] === d[i]) return WHO_PCT[i + 1]; return WHO_PCT[i] + (WHO_PCT[i + 1] - WHO_PCT[i]) * (v - d[i]) / (d[i + 1] - d[i]); }
  }
  return 101;
}
function pctText(p) { if (p == null) return '—'; if (p < 0) return t('pctBelow'); if (p > 100) return t('pctAbove'); return Math.round(p) + ''; }
function interpret(key, p) {
  if (p == null) return '';
  if (key === 'np') return t('iNP');
  if (key === 'im') return p > 95 ? t('iIMhigh') : t('iIMok');
  if (p < 5) return t('iLow'); if (p < 25) return t('iLowNorm'); if (p <= 75) return t('iTypical'); return t('iHigh');
}
const fmt = (v, nd = 1) => (v == null || !isFinite(v)) ? '—' : (LANG === 'en' ? v.toFixed(nd) : v.toFixed(nd).replace('.', ','));
// ------------------------------------------------------------------ воркеры
const DETECT_SRC = CORE_SRC + `
let cvs = null, ctx = null;
self.onmessage = (e) => {
  const m = e.data;
  try {
    if (m.type === 'frame') {
      if (!cvs || cvs.width !== m.W || cvs.height !== m.H) { cvs = new OffscreenCanvas(m.W, m.H); ctx = cvs.getContext('2d', { willReadFrequently: true }); }
      ctx.drawImage(m.img, 0, 0, m.W, m.H); if (m.img.close) m.img.close();
      const d = ctx.getImageData(0, 0, m.W, m.H).data;
      const R = SpermCore.processFrameJS(d, m.W, m.H, m.opt);
      const S = SpermCore.spectrum(R.small, R.W4, R.H4);
      const tr = [S.re.buffer, S.im.buffer]; if (R.patches) tr.push(R.patches.buffer);
      self.postMessage({ dets: R.dets, free: R.free, pitch: R.pitch, patches: R.patches, re: S.re, im: S.im, W4: R.W4, H4: R.H4 }, tr);
    } else if (m.type === 'corr') {
      self.postMessage({ shift: SpermCore.phaseFromSpectra(m.A, m.B, m.W4, m.H4) });
    }
  } catch (err) { if (m.img && m.img.close) try { m.img.close(); } catch (_) {} self.postMessage({ error: String(err && err.message || err) }); }
};`;
const ANALYSIS_SRC = CORE_SRC + `
let A = null;
self.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'init') { A = new SpermCore.Analyzer(m.fps, m.W, m.H, m.opt); }
  else if (m.type === 'add') { A.add(m.fr, m.R, m.shift); }
  else if (m.type === 'finish') {
    try {
      const r = A.finish(m.model);
      const cum = new Float32Array(r._frames.length * 2); r._frames.forEach((f, i) => { cum[2 * i] = f.cum[0]; cum[2 * i + 1] = f.cum[1]; });
      const tracks = new Map(); for (const [id] of r._kin) { const t = r._tracks.get(id); tracks.set(id, { f: t.f, x: t.x, y: t.y }); }
      const overlay = r._overlay; delete r._overlay; delete r._frames; delete r._tracks; delete r._kin;
      self.postMessage({ res: r, overlay, cum, tracks });
    } catch (err) { self.postMessage({ error: String(err && err.message || err) }); }
    A = null;
  }
};`;
const blobURL = src => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
let DETECT_URL = null, ANALYSIS_URL = null;

class Pool {
  constructor(n) { DETECT_URL = DETECT_URL || blobURL(DETECT_SRC); this.ws = []; this.q = [];
    for (let i = 0; i < n; i++) { const w = new Worker(DETECT_URL); w.onmessage = e => this.done(w, e.data); w.onerror = e => this.done(w, { error: e.message || 'ошибка воркера' }); this.ws.push(w); } }
  run(task, transfer) { return new Promise((res, rej) => { this.q.push({ task, transfer, res, rej }); this.pump(); }); }
  pump() { for (const w of this.ws) if (!w.job && this.q.length) { const j = this.q.shift(); w.job = j; w.postMessage(j.task, j.transfer || []); } }
  done(w, data) { const j = w.job; w.job = null; if (j) (data.error ? j.rej(new Error(data.error)) : j.res(data)); this.pump(); }
  close() { this.ws.forEach(w => w.terminate()); }
}

// ------------------------------------------------------------------ чтение видео
function loadMP4(file) {
  return new Promise(async (resolve, reject) => {
    if (!window.MP4Box) return reject(new Error('нет MP4Box'));
    const mp4 = MP4Box.createFile(); let info = null; const samples = [];
    mp4.onError = e => reject(new Error(t('errMp4') + ': ' + e));
    mp4.onReady = i => { info = i; const tr = i.videoTracks[0]; if (!tr) return; mp4.setExtractionOptions(tr.id, null, { nbSamples: 1e9 }); mp4.start(); };
    mp4.onSamples = (id, u, s) => { for (const x of s) samples.push(x); };
    try { const buf = await file.arrayBuffer(); buf.fileStart = 0; mp4.appendBuffer(buf); mp4.flush(); }
    catch (e) { return reject(e); }
    try {
    if (!info || !info.videoTracks.length) return reject(new Error(t('errNoTrack')));
    const tr = info.videoTracks[0];
    let description;
    const trak = mp4.getTrackById(tr.id);
    for (const ent of trak.mdia.minf.stbl.stsd.entries) {
      const box = ent.avcC || ent.hvcC || ent.vpcC || ent.av1C;
      if (box) { const DS = MP4Box.DataStream || window.DataStream; const ds = new DS(undefined, 0, DS.BIG_ENDIAN); box.write(ds); description = new Uint8Array(ds.buffer, 8); break; }
    }
    const fps = samples.length / (tr.duration / tr.timescale) || 30;
    resolve({ samples, fps, W: tr.video ? tr.video.width : tr.track_width, H: tr.video ? tr.video.height : tr.track_height,
      config: { codec: tr.codec, codedWidth: tr.video ? tr.video.width : tr.track_width, codedHeight: tr.video ? tr.video.height : tr.track_height, description } });
    } catch (e) { reject(e); }
  });
}

/* Отдаёт кадры по порядку: onFrame(img, idx) -> Promise (ждём, если конвейер занят). */
async function decodeWebCodecs(meta, onFrame) {
  let idx = 0, err = null, chain = Promise.resolve();
  const dec = new VideoDecoder({
    output: f => { const i = idx++; chain = chain.then(() => onFrame(f, i)).catch(e => { err = e; try { f.close(); } catch (_) {} }); },
    error: e => { err = e; } });
  dec.configure(meta.config);
  for (const s of meta.samples) {
    if (err) throw err;
    dec.decode(new EncodedVideoChunk({ type: s.is_sync ? 'key' : 'delta', timestamp: 1e6 * s.cts / s.timescale, duration: 1e6 * s.duration / s.timescale, data: s.data }));
    while (dec.decodeQueueSize > 6) await new Promise(r => setTimeout(r, 4));
    await chain;   // мягкое ограничение: не уходим далеко вперёд обработки
  }
  await dec.flush(); await chain; dec.close();
  if (err) throw err;
  return idx;
}

async function decodeBySeeking(file, fps, onFrame, onTotal) {
  const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error(t('errOpen'))); });
  const n = Math.floor(v.duration * fps); onTotal(n, v.videoWidth, v.videoHeight);
  for (let i = 0; i < n; i++) {
    v.currentTime = (i + 0.5) / fps; await new Promise(r => v.onseeked = r);
    const bmp = await createImageBitmap(v); await onFrame(bmp, i);
  }
  URL.revokeObjectURL(v.src); return n;
}

// ------------------------------------------------------------------ анализ одного видео
async function analyzeItem(item, settings, onProgress) {
  const nWorkers = Math.max(2, Math.min(6, (navigator.hardwareConcurrency || 4) - 1));
  const pool = new Pool(nWorkers);
  ANALYSIS_URL = ANALYSIS_URL || blobURL(ANALYSIS_SRC);
  const an = new Worker(ANALYSIS_URL);
  let meta = null, useWC = false;
  try { meta = await loadMP4(item.file); useWC = 'VideoDecoder' in window && (await VideoDecoder.isConfigSupported(meta.config)).supported; }
  catch (e) { meta = null; }
  const fps = meta ? meta.fps : 30;
  let total = meta ? meta.samples.length : 0, nativeW = meta ? meta.W : 0, nativeH = meta ? meta.H : 0;
  let scale = 1, Wp = 0, Hp = 0, W4 = 0, H4 = 0, started = false;
  const userUm = parseFloat(String(settings.umPerPx).replace(',', '.'));
  const specs = new Map(), dets = new Map(), shifts = new Map([[0, [0, 0]]]), corrStarted = new Set();
  let next = 0, submitted = 0, waiters = [], failed = null;
  const opt = { chamberDepthUm: settings.depth, gridPitchUm: settings.pitch, dilution: settings.dilution, umPerPx: null };

  const probe = (img) => { // масштаб по сетке на первом кадре
    const c = new OffscreenCanvas(nativeW, nativeH), x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, nativeW, nativeH).data;
    if (userUm > 0) scale = userUm / 0.327;
    else { const R = Core.processFrameJS(d, nativeW, nativeH, { wantPitch: true }); if (R.pitch) scale = NOMINAL_PITCH_PX / R.pitch; }
    if (Math.abs(scale - 1) < 0.08) scale = 1;
    scale = Math.max(0.35, Math.min(2.5, scale));
    Wp = Math.round(nativeW * scale / 4) * 4; Hp = Math.round(nativeH * scale / 4) * 4;
    if (userUm > 0) opt.umPerPx = userUm * nativeW / Wp;
    an.postMessage({ type: 'init', fps, W: Wp, H: Hp, opt });
    started = true;
  };
  const flush = () => {
    while (dets.has(next) && shifts.has(next)) {
      const R = dets.get(next); dets.delete(next);
      const msg = { type: 'add', fr: next, R: R.error ? null : { dets: R.dets, free: R.free, pitch: R.pitch, patches: R.patches }, shift: shifts.get(next) };
      an.postMessage(msg, R.patches ? [R.patches.buffer] : []);
      shifts.delete(next); next++;
    }
    onProgress(next, total);
    const ws = waiters; waiters = []; ws.forEach(r => r());
  };
  const tryCorr = (i) => {
    if (i <= 0 || corrStarted.has(i) || !specs.get(i - 1) || !specs.get(i)) return;
    corrStarted.add(i);
    pool.run({ type: 'corr', A: specs.get(i - 1), B: specs.get(i), W4, H4 })
      .then(r => { shifts.set(i, [r.shift[0] * 4, r.shift[1] * 4]); flush(); })
      .catch(() => { shifts.set(i, [99, 99]); flush(); });
  };
  const onFrame = async (img, fr) => {
    if (failed) { try { img.close(); } catch (_) {} return; }
    if (!started) { nativeW = nativeW || img.displayWidth || img.width; nativeH = nativeH || img.displayHeight || img.height; probe(img); }
    submitted++;
    const o = { wantPatches: fr % 6 === 0, wantPitch: fr < 3 || fr % 60 === 0 };
    pool.run({ type: 'frame', img, fr, W: Wp, H: Hp, opt: o }, [img]).then(R => {
      W4 = R.W4; H4 = R.H4; specs.set(fr, { re: R.re, im: R.im }); delete R.re; delete R.im;
      dets.set(fr, R); tryCorr(fr); tryCorr(fr + 1);
      // спектры старше двух кадров больше не нужны
      for (const k of specs.keys()) if (k < fr - 8 && corrStarted.has(k + 1) && (k === 0 || corrStarted.has(k))) specs.delete(k);
      flush();
    }).catch(e => { dets.set(fr, { error: e.message }); specs.set(fr, null); shifts.set(fr, [99, 99]); if (!corrStarted.has(fr + 1)) { corrStarted.add(fr + 1); shifts.set(fr + 1, [99, 99]); } flush(); });
    while (submitted - next > nWorkers * 3 + 4) await new Promise(r => waiters.push(r));
  };
  try {
    if (meta && useWC) total = await decodeWebCodecs(meta, onFrame);
    else total = await decodeBySeeking(item.file, fps, onFrame, (n, w, h) => { total = n; nativeW = w; nativeH = h; });
    total = submitted;
    while (next < total) await new Promise(r => waiters.push(r));
    const out = await new Promise((res, rej) => { an.onmessage = e => e.data.error ? rej(new Error(e.data.error)) : res(e.data); an.postMessage({ type: 'finish', model: MODEL }); });
    out.res.scale = scale; out.res.nativeW = nativeW; out.res.nativeH = nativeH; out.res.decoder = useWC ? 'WebCodecs' : 'seek';
    if (!meta) out.res.fpsWarning = true;
    return out;
  } finally { pool.close(); an.terminate(); }
}

// ---------------- экспорт
const IN_VIEWER = () => !!(window.claude && typeof window.claude.use === 'function');
async function download(name, mime, content) {
  if (IN_VIEWER()) {   // опубликованная страница: скачивание через разрешение просмотрщика
    const st = document.querySelector('#actStatus');
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: new Blob([content], { type: mime }) }); return; } }
    catch (e) { if (e && e.code === 'declined') return; if (st) st.textContent = (e && e.message) || String(e); return; }
  }
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; };

<title>${esc(t('reportTitle'))} — ${APP_NAME}</title><style>${styles}

      return { file: it.file.name, analyzed: it.date ? it.date.toISOString() : null, settings: it.out.settings, volume_ml: volOf(it),

        total_count_mln: volOf(it) ? r.conc * volOf(it) : null,
        who6: r.who6, who5: r.who5, kinematics_motile: r.kinMotile, progression_speed_hist_2um: r.psHist,
        percentiles_who2021: Object.fromEntries(M.rows.map(m => [m.key, { value: m.v, percentile: m.p == null ? null : (m.p < 0 ? '<2.5' : m.p > 100 ? '>97.5' : +m.p.toFixed(1)) }])),
        quality: { fps: r.fps, duration_s: r.duration, frames_tracked: r.framesTracked, frames_counted: r.framesCounted, fields: r.fields,
          um_per_px: r.um * (r.scale || 1), sperm_tracks: r.tracksByClass, debris_tracks: r.debris } }; }),
  }, null, 2);
}
function exportCSV(list) {
  const head = ['file', 'volume_ml', 'concentration_mln_ml', 'ci95_low', 'ci95_high', 'total_mln', 'a_pct', 'b_pct', 'c_pct', 'd_pct', 'PR_pct', 'NP_pct', 'IM_pct', 'total_motility_pct',
    'pctl_conc', 'pctl_total', 'pctl_PR', 'pctl_total_motility', 'VCL', 'VSL', 'VAP', 'LIN', 'STR', 'ALH', 'BCF'];
  const n = v => (v == null || !isFinite(v)) ? '' : (+v).toFixed(2);
  const lines = list.map(it => { const r = it.out.res, vol = volOf(it), P = Object.fromEntries(metrics(it).rows.map(m => [m.key, m.p]));
    const pp = p => p == null ? '' : p < 0 ? '<2.5' : p > 100 ? '>97.5' : p.toFixed(1); const k = r.kinMotile;
    return ['"' + it.file.name.replace(/"/g, '""') + '"', n(vol), n(r.conc), n(r.ci[0]), n(r.ci[1]), n(vol ? r.conc * vol : null), n(r.who6.a), n(r.who6.b), n(r.who6.c), n(r.who6.d),
      n(r.who5.PR), n(r.who5.NP), n(r.who5.IM), n(r.who6.total), pp(P.conc), pp(P.total), pp(P.pr), pp(P.tm), n(k.vcl), n(k.vsl), n(k.vap), n(k.lin), n(k.str), n(k.alh), n(k.bcf)].join(','); });
  return '﻿' + [head.join(',')].concat(lines).join('\n');
}
function printReport(list) {
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.onload = () => { setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (_) {} setTimeout(() => f.remove(), 60000); }, 300); };
  f.srcdoc = reportHTML(list);
}

// ---------------- проигрыватель
function setupPlayer(el, it) {
  const video = el.querySelector('video'), canvas = el.querySelector('canvas'); if (!video) return;
  const g = canvas.getContext('2d');
  if (!it.url) it.url = URL.createObjectURL(it.file);
  video.src = it.url;
  const { overlay, cum, tracks, res } = it.out;
  const show = { marks: true, trails: true, debris: false };
  el.querySelectorAll('.ptools input').forEach(cb => cb.onchange = () => { show[cb.dataset.k] = cb.checked; draw(lastFr); });
  const col = { a: css('--a'), b: css('--b'), c: css('--c'), d: css('--d'), x: css('--x') };
  let lastFr = 0;
  function draw(fr) {
    lastFr = fr;
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(r.width * dpr)) { canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); }
    g.clearRect(0, 0, canvas.width, canvas.height);
    const list = overlay.get(fr); if (!list) return;
    const k = canvas.width / res.width, cx = cum[2 * fr], cy = cum[2 * fr + 1];
    g.lineWidth = Math.max(1, 1.4 * dpr);
    for (const [x, y, c, id] of list) {
      if (!c || (c === 'x' && !show.debris)) continue;
      g.strokeStyle = col[c];
      if (show.trails && c !== 'x') { const tr = tracks.get(id); if (tr) { const i = tr.f.indexOf(fr); if (i > 0) { g.beginPath(); const j0 = Math.max(0, i - 45);
        for (let j = j0; j <= i; j++) { const px = (tr.x[j] + cx) * k, py = (tr.y[j] + cy) * k; j === j0 ? g.moveTo(px, py) : g.lineTo(px, py); } g.globalAlpha = .75; g.stroke(); g.globalAlpha = 1; } } }
      if (show.marks || c === 'x') { g.beginPath(); g.arc(x * k, y * k, 8 * dpr * Math.max(.6, k / dpr * 2), 0, Math.PI * 2); g.stroke(); }
    }
  }
  const frameOf = tm => Math.max(0, Math.min(res.frames - 1, Math.floor(tm * res.fps + 1e-3)));
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    const cb = (now, m) => { draw(frameOf(m.mediaTime)); video.requestVideoFrameCallback(cb); };
    video.requestVideoFrameCallback(cb);
  } else { const loop = () => { if (!video.isConnected) return; draw(frameOf(video.currentTime)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  video.addEventListener('seeked', () => draw(frameOf(video.currentTime)));
  window.addEventListener('resize', () => draw(lastFr));
}

function renderResults() {
  const box = $('#results');
  const done = items.filter(i => i.state === 'done' && i.out);
  const list = done.length ? done : [EXAMPLE];
  box.innerHTML = summaryHTML(list, true) + list.map(it => cardHTML(it, false)).join('') + noteHTML();
  const cards = box.querySelectorAll('section.card');
  list.forEach((it, i) => { if (!it.example) setupPlayer(cards[i + 1], it); });
  const st = box.querySelector('#actStatus');
  box.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if (act === 'report') download(`Magauiya_report_${stamp()}.html`, 'text/html', reportHTML(done));
    else if (act === 'print') printReport(done);
    else if (act === 'json') download(`Magauiya_data_${stamp()}.json`, 'application/json', exportJSON(done));
    else if (act === 'csv') download(`Magauiya_table_${stamp()}.csv`, 'text/csv', exportCSV(done));
    else if (act === 'copy') {
      const head = [t('sample'), t('concShort'), t('totalShort'), 'a %', 'b %', 'c %', 'd %', 'PR %', 'NP %', 'IM %', t('motShort')];
      const tsv = [head.join('\t')].concat(done.map(it => { const r = it.out.res, v = volOf(it);
        return [it.file.name, r.conc, v ? r.conc * v : null, r.who6.a, r.who6.b, r.who6.c, r.who6.d, r.who5.PR, r.who5.NP, r.who5.IM, r.who6.total].map((x, i) => i ? fmt(x) : x).join('\t'); })).join('\n');
      try { await navigator.clipboard.writeText(tsv); st.textContent = t('copied'); }
      catch (_) { const ta = document.createElement('textarea'); ta.value = tsv; ta.rows = 6; ta.style.width = '100%'; ta.readOnly = true; st.textContent = t('copyManual'); st.after(ta); ta.select(); }
    }
  });
}
