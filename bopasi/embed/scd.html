<style>/* Токены для инструментов BOPASI внутри сайта на Next.js: чёрное на белом, как приборная панель */
:root {
  --paper: #ffffff; --tone: #f2f3f5; --tone2: #e4e6ea; --ink: #0b0d12; --soft: #555b66; --navy: #0b0d12; --navy2: #2a2f38;
  --blue: #0b0d12; --blue-d: #000000; --cyan: #8b93a1; --ice: #f2f3f5; --mist: #f2f3f5; --line: #dcdfe4; --red: #0b0d12;
  --text: var(--ink); --muted: var(--soft);
  --good: #0b7a54; --good-bg: #e3f5ee; --warn: #9a4a12; --warn-bg: #fbeee2;
  --fd: 'IBM Plex Sans', system-ui, sans-serif;
  --fb: 'IBM Plex Sans', system-ui, sans-serif;
  --fm: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --t1: 64px; --t2: 40px; --t3: 22px; --t4: 17px; --t5: 14px;
}
.tool-root { font-family: var(--fb); color: var(--ink); font-size: 16px; line-height: 1.55; }
.tool-root h1, .tool-root h2, .tool-root h3 { font-family: var(--fd); }
.tool-root button { cursor: pointer; }
.tool-root .big { border-radius: 4px; background: var(--navy); color: #fff; }
.tool-root .big:first-child { background: var(--red); }
.tool-root .big .k { text-transform: none; letter-spacing: 0; font-size: 14px; }
.tool-root .big strong { overflow-wrap: anywhere; }
.tool-root .btn { background: var(--blue); color: #fff; border-radius: 2px; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.tool-root .btn-ghost { border-radius: 2px; }
.tool-root .line > :last-child { white-space: nowrap; }
.tool-root .launch { background: var(--tone); padding: 32px; display: grid; gap: 24px; justify-items: start; max-width: 720px; }
.tool-root .btn-big { display: inline-flex; background: var(--blue); color: #fff; text-decoration: none; padding: 16px 28px; border-radius: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; }
.embed.fs { position: fixed; inset: 0; z-index: 80; }
@media (max-width: 1100px) {
  .tool-root .rc, .tool-root .dc, .tool-root .scd, .tool-root .mm, .tool-root .calc, .tool-root .cnt-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .tool-root .dc-anat { height: 380px; } .tool-root .dc-props { grid-template-columns: 1fr; }
  .tool-root .cycle { grid-template-columns: 1fr; gap: 4px; } .tool-root .embed-frame { height: 78vh; }
  .tool-root .cnt-defs { grid-template-columns: 1fr; }
}

/* ── общие элементы инструментов */
.btn, .btn-ghost, .btn-link { border-radius: 10px; font-weight: 600; font-size: 14px; padding: 10px 18px; border: 1px solid transparent; transition: background .2s, border-color .2s, color .2s; }
.btn { background: var(--blue); color: #fff; }
.btn:hover { background: var(--blue-d); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--text); }
.btn-ghost:hover, .btn-ghost.on { border-color: var(--blue); color: var(--blue); }
.btn-ghost.on { background: rgba(31,79,255,.07); }
.btn-ghost.sm { padding: 6px 14px; font-size: 13px; }
.btn-link { background: none; color: var(--blue); padding: 6px 2px; }
.btn-link:hover { text-decoration: underline; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 4px; border-radius: 10px; background: var(--mist); }
.seg button { background: none; border: 0; padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: #fff; color: var(--blue); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--mist); border: 1px solid transparent; border-radius: 10px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink); }
.chips button:hover { border-color: var(--line); }
.chips button.on { background: var(--navy); color: #fff; }
.hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.warn-box { background: var(--warn-bg); color: var(--warn); padding: 12px 16px; border-radius: 10px; font-size: 14px; margin: 16px 0 0; }
.mono { font-family: var(--fm); }
input[type=text], input[type=number], input[type=date], input[type=url], select { width: 100%; min-width: 0; font: inherit; font-size: var(--t4); color: var(--text); background: var(--mist); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; outline: none; }
input:focus, select:focus { border-color: var(--blue); background: #fff; }
input[type=range] { width: 100%; accent-color: var(--blue); }
.drop { display: grid; gap: 4px; place-items: center; text-align: center; border: 1.5px dashed #b9c9ee; border-radius: 10px; padding: 22px 16px; background: var(--mist); cursor: pointer; transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--blue); background: rgba(31,79,255,.05); }
.drop strong { font-size: 14px; }
.drop span { font-size: 12px; color: var(--muted); }

/* встроенные приложения */
.embed { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.embed-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px 10px 18px; background: var(--tone); font-size: 13px; font-weight: 600; color: var(--muted); }
.embed-frame { display: block; width: 100%; height: min(82vh, 940px); border: 0; background: #fff; }
.embed.fs { position: fixed; inset: 0; z-index: 20; border-radius: 10px; }

/* RC ⇄ PC */
.rc { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; }

.rc-src { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.rc-bar { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
.rc-tag { position: absolute; top: 12px; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #fff; background: rgba(6,18,58,.75); }
.rc-tag.l { left: 12px; } .rc-tag.r { right: 12px; background: var(--blue); }
.rc-split { margin-top: 12px; }
.rc-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.rc-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.thumb { padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: none; width: 72px; height: 54px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.on { border-color: var(--blue); }
.rc-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rc-side .seg { display: grid; grid-template-columns: 1fr 1fr; }
.ctl { display: grid; gap: 6px; }
.ctl-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
.ctl-row output { font-family: var(--fm); font-weight: 400; color: var(--muted); font-size: 12px; text-align: right; }
.rc-busy { font-size: 13px; color: var(--muted); }

/* калькуляторы */
.calc { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 32px; align-items: start; }
.calc-form { display: grid; gap: 16px; padding: 24px; border-radius: 10px; background: var(--mist); }
.field { display: grid; gap: 7px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink); }
.field input, .field select { background: #fff; }
.calc-form .seg { width: 100%; background: #fff; }
.calc-result { display: grid; gap: 8px; min-width: 0; }
.bigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 6px; }
.big { padding: 22px; border-radius: 10px; background: var(--navy); color: #fff; display: grid; gap: 6px; align-content: start; }
.big:first-child { background: var(--blue); }
.big .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: rgba(234,244,255,.7); font-weight: 600; }
.big strong { font: 600 clamp(20px, 2.2vw, 28px)/1.15 var(--fd); }
.big .s { font-size: 13px; color: rgba(234,244,255,.7); }
.line { display: flex; justify-content: space-between; gap: 16px; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; }
.line span { color: var(--muted); }
.line b { text-align: right; font-weight: 600; }
.line.good { border-color: #bfe6d6; background: var(--good-bg); } .line.good b { color: var(--good); }
.line.warn { border-color: #f3d6b3; background: var(--warn-bg); } .line.warn b { color: var(--warn); }
.sub { font-size: 14px; font-weight: 600; margin: 16px 0 4px; color: var(--navy); }
.cycle { display: grid; grid-template-columns: 90px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; }
.cycle .k { font-weight: 600; color: var(--muted); }
.cycle b { color: var(--blue); font-weight: 600; }

/* конструктор */
.dc { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 28px; }
.dc-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dc-anat { position: relative; height: 470px; border-radius: 10px; overflow: hidden; background: var(--ice); border: 1px solid var(--line); }
.dc-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.dc-label { position: absolute; pointer-events: none; background: var(--navy); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 10px; white-space: nowrap; }
.dc-own { padding: 16px; border-radius: 10px; background: var(--mist); display: grid; gap: 10px; }
.dc-own .k { font-size: 13px; font-weight: 600; color: var(--ink); }
.dc-own input { width: 110px; flex: none; text-transform: uppercase; background: #fff; }
.dc-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dc-empty { display: grid; place-content: center; text-align: center; min-height: 420px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 32px; }
.dc-empty h4 { font-size: 22px; color: var(--navy); }
.dc-empty p { color: var(--muted); max-width: 380px; margin: 10px auto 0; }
.dc-target .k { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.dc-target h4 { font-size: 24px; color: var(--navy); margin-top: 6px; }
.dc-target p { color: var(--muted); margin: 8px 0 0; }
.dc-mol { position: relative; height: 340px; border-radius: 10px; overflow: hidden; background: var(--navy); }
.dc-mol-host { position: absolute; inset: 0; }
.dc-mol-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--on-dark-2); font-size: 14px; z-index: 1; }
.dc-pdb { position: absolute; right: 12px; top: 12px; z-index: 2; background: rgba(255,255,255,.14); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 10px; }
.dc-pane .row input { flex: 1; }
.dc-analogs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.dc-analogs button { display: grid; gap: 3px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; min-width: 0; }
.dc-analogs button.on { border-color: var(--blue); background: rgba(31,79,255,.06); }
.dc-analogs .mono { font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-analogs .meta { font-size: 11px; color: var(--muted); }
.dc-props { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: 10px; border: 1px solid var(--line); }
.dc-svg { background: #fff; border-radius: 10px; display: grid; place-items: center; }
.dc-svg svg { width: 100%; height: auto; }
.formula { font: 600 16px var(--fm); color: var(--navy); margin-bottom: 10px; }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; }
.pv { display: grid; gap: 2px; font-size: 12px; }
.pv span { color: var(--muted); }
.pv b { font-size: var(--t5); font-variant-numeric: tabular-nums; }
.pv b.good { color: var(--good); } .pv b.warn { color: var(--warn); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.badges span { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; }
.badges .good { background: var(--good-bg); color: var(--good); } .badges .warn { background: var(--warn-bg); color: var(--warn); } .badges .info { background: rgba(31,79,255,.08); color: var(--blue); }



/* SCD / Halo */
.scd { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 26px; }
.scd-stage { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #eee; }
.scd-canvas { display: block; width: 100%; height: auto; }
.scd-empty { width: 100%; min-height: 360px; display: grid; place-content: center; gap: 8px; text-align: center; padding: 32px; border: 2px dashed var(--line); border-radius: 12px; background: var(--tone); color: var(--ink); font: inherit; cursor: pointer; }
.scd-empty strong { font-size: 18px; max-width: 32ch; }
.scd-empty span { color: var(--soft); font-size: 14px; }
.scd-empty:hover { border-color: var(--blue); }
.scd-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.scd-result { display: grid; gap: 10px; }
.scd-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.scd-legend .lg { display: inline-flex; align-items: center; gap: 7px; }
.scd-legend i { width: 16px; height: 11px; border-radius: 10px; border: 2.5px solid; }
.scd-bars { display: grid; gap: 7px; }
.scd-bars .bar { display: grid; grid-template-columns: 112px 1fr 70px; align-items: center; gap: 10px; font-size: 13px; }
.scd-bars .track { height: 8px; border-radius: 10px; background: var(--mist); overflow: hidden; }
.scd-bars .track i { display: block; height: 100%; border-radius: 10px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.scd-bars b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.scd-side select { width: auto; flex: 1; }
.scd-empty[hidden], .scd-canvas[hidden] { display: none !important; }
.scd .seg-3 { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
.scd .seg-3 button { padding: 9px 6px; white-space: normal; line-height: 1.2; font-size: 13px; }
.scd .seg-3 button:disabled { opacity: .55; cursor: progress; }
.scd-req { padding: 12px 14px; border-radius: 10px; background: var(--tone); border-left: 3px solid var(--blue); display: grid; gap: 4px; }
.scd-req .k, .scd-compare .k { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
.scd-req p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.scd-samples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.scd-samples .tab { border: 1px solid var(--line); background: none; color: var(--ink-2); border-radius: 10px; padding: 7px 12px; font: 600 13px/1 inherit; cursor: pointer; }
.scd-samples .tab.on { border-color: var(--blue); color: var(--blue); background: var(--tone); }
.scd-samples .tab.add { border-style: dashed; color: var(--muted); }
.thumb-w { position: relative; display: inline-block; }
.thumb-x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 13px; line-height: 1; padding: 0; cursor: pointer; }
.scd-compare { display: grid; gap: 8px; }
.scd-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.scd-table th, .scd-table td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.scd-table th { font-weight: 600; color: var(--muted); font-size: 12px; }
.scd-table tr.on td { color: var(--blue); font-weight: 600; }

/* лабораторный счётчик */
.cnt { border-radius: 10px; border: 1px solid var(--line); padding: 22px; background: #fff; }
.cnt-top { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.cnt-top select { width: auto; }
.seg-wrap { display: flex; flex-wrap: wrap; border-radius: 10px; }
.cnt-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 320px); gap: 24px; align-items: start; }
.cnt-left { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cnt-ring { position: relative; width: 168px; height: 168px; }
.cnt-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cnt-ring .rt { fill: none; stroke: var(--mist); stroke-width: 10; }
.cnt-ring .rp { fill: none; stroke: var(--blue); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.cnt-ring.full .rp { stroke: var(--good); }
.cnt-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.cnt-num strong { font: 800 44px/1 var(--fd); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cnt-num span { font-size: 13px; color: var(--ink-3); }
.cnt.ping .cnt-num strong { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.14); color: var(--blue); } }
.cnt-done { margin: 0; font-weight: 600; color: var(--good); }
.cnt-pad { display: grid; gap: 10px; }
.cnt-pad.two { grid-template-columns: 1fr 1fr; }
.cnt-big { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left; padding: 18px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: var(--t4); transition: transform .12s, border-color .2s, background .2s; }
.cnt-big:active { transform: scale(.97); }
.cnt-big.good:hover { border-color: var(--good); background: var(--good-bg); }
.cnt-big.bad:hover { border-color: var(--warn); background: var(--warn-bg); }
.cnt-big.dim { opacity: .55; }
.cnt-big b { font: 700 22px var(--fd); font-variant-numeric: tabular-nums; }
.cnt-defs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cnt-def { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--mist); font-size: 14px; font-weight: 500; }
.cnt-def.on { border-style: solid; border-color: var(--warn); background: var(--warn-bg); }
.cnt-def b { font-variant-numeric: tabular-nums; color: var(--ink-3); }
kbd { font: 600 11px var(--fm); padding: 2px 6px; border-radius: 10px; border: 1px solid var(--line); border-bottom-width: 2px; background: #fff; color: var(--ink-2); }

/* морфометрия */
.mm { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 26px; }
.mm-stage { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #ccc; }

.field.check { display: flex; align-items: center; gap: 10px; }

.sci-bar { margin-bottom: 12px; gap: 8px; }
.sci-sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }

function loadScript(srcs) {
  return new Promise((resolve, reject) => {
    const next = (i) => {
      if (i >= srcs.length) return reject(new Error('script'));
      const s = document.createElement('script');
      s.src = srcs[i]; s.async = true;
      s.onload = () => resolve(srcs[i]);
      s.onerror = () => { s.remove(); next(i + 1); };
      document.head.append(s);
    };
    next(0);
  });
}

let molPromise;
function load3Dmol() {

}

let rdkitPromise;
function loadRDKit() {

const TOOLS_DATA = [{"id":"scd","section":"andrology","interactive":"scd","action":"analyze","authors":"BOPASI · критерии SCD: Fernández (2003, 2005) · нейросеть ×100: YOLOv8s-seg на открытом наборе SCD-снимков (CC BY 4.0), Ultralytics (AGPL-3.0) · нейросеть ×20: CenterNet-ResNet18 на открытом наборе SCD-снимков ×20 (CC BY 4.0, код BSD-3)","name":"SCD / Halo · DFI","tagline":{"ru":"Индекс фрагментации ДНК по тесту дисперсии хроматина: три метода подсчёта — классический и две нейросети, несколько снимков и образцов.","kk":"Хроматин дисперсиясы тесті бойынша ДНҚ фрагментациясының индексі: үш санау әдісі — классикалық және екі нейрожелі, бірнеше сурет пен үлгі.","en":"DNA fragmentation index from the chromatin dispersion test: three counting methods — classic and two neural nets, many images and samples."},"full":{"ru":"После кислотной денатурации и лизиса неповреждённая ДНК образует вокруг ядра крупное гало из петель хроматина, а фрагментированная — малое гало или не образует его вовсе. Инструмент оценивает фон, выделяет ядра (в том числе слабо окрашенные, дегенеративные), измеряет ширину гало по 48 лучам с учётом соседних клеток и относит каждое ядро к классу по критериям Fernández: большое гало — ширина не меньше малого диаметра ядра, малое — не больше трети, между ними — среднее. DFI = (малое + без гало + дегенеративные) / все учтённые × 100%. Каждую клетку можно исправить кликом.","kk":"Қышқылдық денатурация мен лизистен кейін зақымданбаған ДНҚ ядро айналасында хроматин ілмектерінен үлкен гало түзеді, ал фрагменттелгені — кіші гало түзеді немесе мүлде түзбейді. Құрал фонды бағалайды, ядроларды (соның ішінде әлсіз боялған, дегенеративті) бөледі, көрші жасушаларды ескере отырып гало енін 48 сәуле бойынша өлшейді және әр ядроны Fernández критерийлері бойынша класқа жатқызады: үлкен гало — ені ядроның кіші диаметрінен кем емес, кіші — үштен бірінен аспайды, арасындағысы — орташа. DFI = (кіші + галосыз + дегенеративті) / барлық есепке алынған × 100%. Әр жасушаны басу арқылы түзетуге болады.","en":"After acid denaturation and lysis, intact DNA forms a large halo of chromatin loops around the nucleus, while fragmented DNA forms a small halo or none. The tool estimates the background, segments nuclei (including weakly stained, degraded ones), measures halo width along 48 rays while respecting neighbouring cells, and classifies each nucleus by the Fernández criteria: large halo — width at least the core minor diameter; small — at most one third of it; medium — in between. DFI = (small + no halo + degraded) / all counted × 100%. Every cell can be corrected with a click."},"features":[{"ru":"Три метода: классический, «Нейросеть ×100» и «Нейросеть ×20» — у каждого свои требования к снимкам","kk":"Үш әдіс: классикалық, «Нейрожелі ×100» және «Нейрожелі ×20» — әрқайсысының суретке өз талаптары бар","en":"Three methods: classic, “Neural net ×100” and “Neural net ×20”, each with its own image requirements"},{"ru":"Несколько снимков на образец и несколько образцов: DFI по каждому образцу и каждому методу","kk":"Бір үлгіге бірнеше сурет және бірнеше үлгі: әр үлгі мен әр әдіс бойынша DFI","en":"Several images per sample and several samples: a DFI for every sample and every method"},{"ru":"«Посчитать всеми методами» — сравнение DFI в одной таблице","kk":"«Барлық әдіспен есептеу» — DFI-ді бір кестеде салыстыру","en":"“Count with every method” — DFI compared in one table"},{"ru":"Классы Fernández: большое, среднее, малое гало, без гало, дегенеративные","kk":"Fernández кластары: үлкен, орташа, кіші гало, галосыз, дегенеративті","en":"Fernández classes: large, medium, small halo, no halo, degraded"},{"ru":"Нейросети работают прямо в браузере — снимки никуда не отправляются","kk":"Нейрожелілер тікелей браузерде жұмыс істейді — суреттер ешқайда жіберілмейді","en":"The neural nets run right in the browser — images are never uploaded"},{"ru":"Правка кликом, добавление пропущенных, отчёт и CSV","kk":"Басу арқылы түзету, өткізілгендерді қосу, есеп және CS ×100 — «Нейросеть ×100», ×20 — «Нейросеть ×20».","kk":"Суреттердің үлкейтуіне қарай әдісті таңдаңыз: ×40 — классикалық, ×100 — «Нейрожелі ×100», ×20 — «Нейрожелі ×20».","en":"Pick the method by magnification: ×40 — classic, ×100 — “Neural net ×100”, ×20 — “Neural net ×20”."},{"ru":"Перетащите снимки полей — можно несколько сразу; анализ запускается сразу.","kk":"Өріс суреттерін сүйреңіз — бірден бірнешеуін; талдау бірден басталады.","en":"Drop the field images — several at once; analysis starts immediately."},{"ru":"Для следующего пациента нажмите «Новый образец» и загрузите его снимки.","kk":"Келесі пациент үшін «Жаңа үлгі» батырмасын басып, оның суреттерін жүктеңіз.","en":"For the next patient press “New sample” and load their images."},{"ru":"Проверьте разметку: клик по ядру меняет класс, «Добавить пропущенное» — для пропущенных клеток.","kk":"Белгілеуді тексеріңіз: ядроны басу класты ауыстырады, «Өткізілгенді қосу» — өткізілген жасушалар үшін.","en":"Check the overlay: clicking a nucleus changes its class, “Add a missed one” adds missed cells."},{"ru":"«Посчитать всеми методами» покажет DFI каждого метода по каждому образцу.","kk":"«Барлық әдіспен есептеу» әр үлгі бойынша әр әдістің DFI-ін көрсетеді.","en":"“Count with every method” shows each method’s DFI for every sample."},{"ru":"Скопируйте отчёт или скачайте CSV (образец × метод × поле).","kk":"Есепті көшіріңіз немесе CSV жүктеңіз (үлгі × әдіс × өріс).","en":"Copy the report or download the CSV (sample × method × field)."}],"limits":[{"ru":"Каждый метод надёжен только на своём увеличении: «Нейросеть ×100» на полях ×20–×40 клеток не находит, «Нейросеть ×20» на снимках ×100 тоже; классический метод при ×10–×20 завышает DFI.","kk":"Әр әдіс тек өз үлкейтуінде сенімді: «Нейрожелі ×100» ×20–×40 өрістерде жасуша таппайды, «Нейрожелі ×20» ×100 суреттерде де таппайды; классикалық әдіс ×10–×20 кезінде DFI-ді жоғарылатады.","en":"Each method is reliable only at its own magnification: “Neural net ×100” finds no cells on es."},{"ru":"«Малое гало» и «без гало» различаются хуже всего (гало шириной 1–3 пикс.), но оба входят в DFI одинаково.","kk":"«Кіші гало» мен «галосыз» ең нашар ажыратылады (ені 1–3 пикс. гало), бірақ екеуі де DFI-ге бірдей кіреді.","en":"“Small halo” and “no halo” are the hardest to tell apart (halos of 1–3 px), but both count the same in DFI."},{"ru":"Перекрывающиеся гало, пузыри агарозы и расфокус — главные источники ошибок; снимайте поля без наложений.","kk":"Қабаттасқан гало, агароза көпіршіктері және фокуссыздық — қателердің негізгі көздері; қабаттасусыз өрістерді түсіріңіз.","en":"Overlapping halos, agarose bubbles and defocus are the main error sources; capture fields without overlaps."},{"ru":"Файлы TIFF браузеры не открывают — сохраните снимок как PNG или JPG.","kk":"Браузерлер TIFF файлдарын ашпайды — суретті PNG немесе JPG ретінде сақтаңыз.","en":"Browsers cannot open TIFF — save the image as PNG or JPG."}],"output":[{"ru":"Число ядер каждого класса и DFI % по образцу и по полям","kk":"Әр кластағы ядролар саны және үлгі мен өрістер бойынша DFI %","en":"Nuclei per class and DFI % for the sample and each field"},{"ru":"Ориентиры: \u003c 15% — низкий, 15–30% — пограничный, ≥ 30% — высокий (пороги зависят от набора и лаборатории)","kk":"Бағдарлар: \u003c 15% — төмен, 15–30% — шекаралық, ≥ 30% — жоғары (табалдырықтар жинаққа және зертханаға байланысты)","en":"Guide: \u003c 15% low, 15–30% borderline, ≥ 30% high (cut-offs depend on the kit and lab)"}]}];

// ─── Движок SCD / Halo-теста (дисперсия хроматина сперматозоидов) ──────────
// Критерии Fernández et al.: ширина гало относительно малого диаметра ядра.
//   большое гало   — ширина ≥ малого диаметра ядра;
//   среднее гало   — между большим и малым;
//   малое гало     — ширина ≤ 1/3 малого диаметра ядра;
//   без гало;  без гало, дегенеративное — ядро слабо или неравномерно окрашено.
// DFI = (малое + без гало + дегенеративные) / все учтённые × 100%.
const SCD = (() => {
  const CLASSES = ['large', 'medium', 'small', 'none', 'degraded', 'excluded'];
  let FLAT = 0.5;
  const FRAG = new Set(['small', 'none', 'degraded', 'frag']);
  const AI_CLASSES = ['ok', 'frag', 'excluded'];   // режим нейросети: два класса

  // ── подготовка: «окраска» относительно оценённого фона
  function prepare(img) {
    const { width: w, height: h, data } = img, n = w * h;
    const c = new Float32Array(n), lum = new Float32Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4) { lum[i] = 0.3 * data[p] + 0.59 * data[p + 1] + 0.11 * data[p + 2]; c[i] = data[p + 1]; }
    // снимок через окуляр (телефоном): круглое поле зрения в чёрной рамке — считаем только внутри круга
    const field = findField(lum, w, h);
    const inF = field ? (i) => { const x = i % w, y = (i / w) | 0; return Math.hypot(x - field.cx, y - field.cy) < field.r; } : null;
    let med;
    if (field) {
      const inside = []; for (let i = 0; i < n; i += 7) if (inF(i)) inside.push(lum[i]);
      med = quantile(Float32Array.from(inside), 0.5);
    } else med = quantile(lum, 0.5);
    const bright = med > 100;                         // светлое поле или флуоресценция
    const src = bright ? c : lum;
    if (field) {   // вне круга — значение фона поля, чтобы рамка не считалась окраской
      const vals = []; for (let i = 0; i < n; i += 7) if (inF(i)) vals.push(src[i]);
      const fill = quantile(Float32Array.from(vals), bright ? 0.88 : 0.12);
      for (let i = 0; i < n; i++) if (!inF(i)) src[i] = fill;
    }
    const B = Math.max(16, Math.round(Math.min(w, h) / 14));   // блок крупнее большого гало
    const gw = Math.ceil(w / B), gh = Math.ceil(h / B), grid = new Float32Array(gw * gh);
    const buf = [];
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      buf.length = 0;
      for (let y = gy * B; y < Math.min(h, gy * B + B); y += 2) for (let x = gx * B; x < Math.min(w, gx * B + B); x += 2) buf.push(src[y * w + x]);
      buf.sort((a, b) => a - b);
      grid[gy * gw + gx] = buf[Math.floor((bright ? 0.88 : 0.12) * (buf.length - 1))];
    }
    // сглаживание сетки фона 3×3 (медианно-подобно: среднее без крайних)
    const g2 = new Float32Array(grid.length);
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const v = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const yy = gy + dy, xx = gx + dx; if (yy >= 0 && yy < gh && xx >= 0 && xx < gw) v.push(grid[yy * gw + xx]); }
      v.sort((a, b) => a - b); g2[gy * gw + gx] = bright ? v[Math.floor(v.length * 0.6)] : v[Math.floor(v.length * 0.4)];
    }
    const S = new Float32Array(n);
    for (let y = 0; y < h; y++) {
      const fy = Math.min(gh - 1, Math.max(0, (y + 0.5) / B - 0.5)), y0 = Math.floor(fy), y1 = Math.min(gh - 1, y0 + 1), ty = fy - y0;
      for (let x = 0; x < w; x++) {
        const fx = Math.min(gw - 1, Math.max(0, (x + 0.5) / B - 0.5)), x0 = Math.floor(fx), x1 = Math.min(gw - 1, x0 + 1), tx = fx - x0;
        const bg = (g2[y0 * gw + x0] * (1 - tx) + g2[y0 * gw + x1] * tx) * (1 - ty) + (g2[y1 * gw + x0] * (1 - tx) + g2[y1 * gw + x1] * tx) * ty;
        const v = src[y * w + x];
        S[y * w + x] = bright ? Math.max(0, (bg - v) / Math.max(bg, 1)) : Math.max(0, (v - bg) / Math.max(255 - bg, 1));
      }
    }
    // подавление шума: два прохода бокс-фильтра 3×3
    const Sm = boxSmooth(boxSmooth(S, w, h), w, h);
    if (field) for (let i = 0; i < n; i++) if (!inF(i)) Sm[i] = 0;
    return { w, h, S: Sm, bright, field };
  }
  // круг поля зрения: самая большая светлая область, если вокруг много почти чёрного
  function findField(lum, w, h) {
    const st = Math.max(1, Math.round(Math.min(w, h) / 300)), gw = Math.ceil(w / st), gh = Math.ceil(h / st), g = new Uint8Array(gw * gh);
    let dark = 0, tot = 0;
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) { const v = lum[Math.min(h - 1, gy * st) * w + Math.min(w - 1, gx * st)]; tot++; if (v < 45) dark++; else if (v > 80) g[gy * gw + gx] = 1; }
    if (dark / tot < 0.12) return null;
    const lab = new Int32Array(gw * gh); let best = null, id = 0; const q = [];
    for (let i = 0; i < g.length; i++) {
      if (!g[i] || lab[i]) continue; id++; lab[i] = id; q.length = 0; q.push(i); let A = 0, sx = 0, sy = 0;
      while (q.length) { const j = q.pop(), x = j % gw, y = (j / gw) | 0; A++; sx += x; sy += y;
        for (const k of [j - 1, j + 1, j - gw, j + gw]) if (k >= 0 && k < g.length && g[k] && !lab[k] && Math.abs((k % gw) - x) <= 1) { lab[k] = id; q.push(k); } }
      if (!best || A > best.A) best = { A, sx, sy };
    }
    if (!best || best.A < 0.05 * tot) return null;
    return { cx: (best.sx / best.A + 0.5) * st, cy: (best.sy / best.A + 0.5) * st, r: Math.sqrt(best.A / Math.PI) * st * 0.97 };
  }

  function boxSmooth(a, w, h) {
    const o = new Float32Array(a.length);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, n = 0;

    { id: 'day', type: 'select', value: 5, options: [[3, L('3 сутки (дробление)', '3 тәулік (бөліну)', 'Day 3 (cleavage)')], [5, L('5 сутки (бластоциста)', '5 тәулік (бластоциста)', 'Day 5 (blastocyst)')], [6, L('6 сутки (бластоциста)', '6 тәулік (бластоциста)', 'Day 6 (blastocyst)')]], label: L('Возраст эмбриона', 'Эмбрион жасы', 'Embryo age'), show: (v) => v.m === 'et' },
  ], (v) => {
    let conception;
    if (v.m === 'lmp') { const d = new Date(v.lmp + 'T00:00:00'); if (isNaN(d) || !v.cyc) return null; conception = addDays(d, 14 + (v.cyc - 28)); }
    else { const d = new Date(v.et + 'T00:00:00'); if (isNaN(d)) return null; conception = addDays(d, -parseInt(v.day)); }
    const start = addDays(conception, -14), edd = addDays(conception, 266);
    const ga = Math.floor((today - start) / 86400000);
    const gaTxt = ga >= 0 ? `${Math.floor(ga / 7)} ${tr(L('нед', 'апта', 'wk'))} ${ga % 7} ${tr(L('дн', 'күн', 'd'))}` : '—';
    return [
      h('div', { class: 'bigs' }, big(tr(L('Предполагаемая дата родов', 'Болжамды босану күні', 'Estimated due date')), fmtDate(edd)), big(tr(L('Срок сегодня', 'Бүгінгі мерзім', 'Gestational age today')), gaTxt)),
      line(tr(L('Зачатие / овуляция', 'Ұрықтану / овуляция', 'Conception / ovulation')), fmtDate(conception)),
      line(tr(L('Тест на β-ХГЧ (≈ 9 дней после)', 'β-ХГЧ тесті (≈ 9 күннен кейін)', 'β-hCG test (≈ 9 days after)')), fmtDate(addDays(conception, 9))),
      line(tr(L('Скрининг I триместра (11+0 – 13+6 нед)', 'I триместр скринингі (11+0 – 13+6 апта)', '1st-trimester screening (11+0 – 13+6 wk)')), `${fmtDate(addDays(start, 77))} – ${fmtDate(addDays(start, 97))}`),
      line(tr(L('Конец I триместра (13+6 нед)', 'I триместр соңы (13+6 апта)', 'End of 1st trimester (13+6 wk)')), fmtDate(addDays(start, 97))),
    ];
  });
}

// Удвоение ХГЧ
function mountHcg(root) {
  return calcShell(root, [
    { id: 'a', value: 120, label: L('β-ХГЧ, первое значение (мЕд/мл)', 'β-ХГЧ, бірінші мән (мБ/мл)', 'β-hCG, first value (mIU/mL)') },
    { id: 'b', value: 265, label: L('β-ХГЧ, второе значение (мЕд/мл)', 'β-ХГЧ, екінші мән (мБ/мл)', 'β-hCG, second value (mIU/mL)') },
    { id: 't', value: 48, label: L('Интервал между заборами, ч', 'Алу аралығы, сағ', 'Interval between draws, h') },
  ], (v) => {
    if (!(v.a > 0 && v.b > 0 && v.t > 0)) return null;
    const ratio = v.b / v.a, rise48 = (Math.pow(ratio, 48 / v.t) - 1) * 100;
    const dt = ratio > 1 ? (Math.LN2 * v.t) / Math.log(ratio) : null;
    const minRise = v.a < 1500 ? 49 : v.a < 3000 ? 40 : 33;
    const ok = rise48 >= minRise;
    return [
      h('div', { class: 'bigs' },
        big(tr(L('Время удвоения', 'Екі еселену уақыты', 'Doubling time')), dt ? `${num(dt)} ${tr(L('ч', 'сағ', 'h'))}` : '—'),
        big(tr(L('Прирост за 48 ч', '48 сағаттағы өсім', 'Rise over 48 h')), `${num(rise48, 0)}%`, `${tr(L('минимум ожидаемый', 'күтілетін минимум', 'minimum expected'))} ${minRise}%`)),
      line(tr(L('Оценка прироста', 'Өсімді бағалау', 'Rise assessment')), ok ? tr(L('в пределах ожидаемого', 'күтілгендей', 'within expected range')) : tr(L('ниже ожидаемого — обсудите с врачом', 'күтілгеннен төмен — дәрігермен талқылаңыз', 'below expected — discuss with a clinician')), ok ? 'good' : 'warn'),
      h('p', { class: 'hint' }, tr(L('Минимальный ожидаемый прирост за 48 ч для маточной беременности: 49% при исходном уровне < 1500, 40% при 1500–3000, 33% при > 3000 мЕд/мл (Barnhart et al., 2016). Медленный прирост — не диагноз.', 'Жатырішілік жүктілік үшін 48 сағаттағы ең аз күтілетін өсім: бастапқы деңгей < 1500 болса 49%, 1500–3000 болса 40%, > 3000 мБ/мл болса 33% (Barnhart et al., 2016). Баяу өсім — диагноз емес.', 'Minimum expected 48-h rise for an intrauterine pregnancy: 49% for a starting level < 1500, 40% for 1500–3000, 33% for > 3000 mIU/mL (Barnhart et al., 2016). A slow rise is not a diagnosis.'))),
    ];
  });
}

// TMSC + сравнение с ВОЗ-6 (нижние референсы, 5-й процентиль)
function mountTmsc(root) {
  return calcShell(root, [
    { id: 'vol', value: 3.0, step: 0.1, label: L('Объём, мл', 'Көлем, мл', 'Volume, mL') },
    { id: 'conc', value: 40, label: L('Концентрация, млн/мл', 'Концентрация, млн/мл', 'Concentration, M/mL') },
    { id: 'pr', value: 35, label: L('Прогрессивная подвижность PR, %', 'Прогрессивті қозғалғыштық PR, %', 'Progressive motility PR, %') },
    { id: 'np', value: 10, label: L('Непрогрессивная NP, %', 'Прогрессивті емес NP, %', 'Non-progressive NP, %') },
  ], (v) => {
    if (!(v.vol > 0 && v.conc >= 0)) return null;
    const pr = v.pr || 0, np = v.np || 0, total = v.vol * v.conc, tmsc = total * (pr + np) / 100, tpmsc = total * pr / 100;

      ...who.map(([k, val, ref, u]) => line(`${tr(k)} · ≥ ${ref} ${tr(u)}`, `${num(val, val < 10 ? 1 : 0)} ${tr(u)}`, val >= ref ? 'good' : 'warn')),
      h('p', { class: 'hint' }, tr(L('Пороги ВМИ/ЭКО/ИКСИ различаются между клиниками; решение принимает врач. Значения можно перенести из отчёта BOPASI.', 'ЖІҰ/ЭКҰ/ИКСИ табалдырықтары клиникаларда әртүрлі; шешімді дәрігер қабылдайды. Мәндерді BOPASI есебінен көшіруге болады.', 'IUI/IVF/ICSI cut-offs vary by clinic; the clinician decides. Values can be copied from the BOPASI report.'))),
    ];

}

// Фертильное окно
function mountFertile(root) {

  });
}

// Гарднер
function mountGardner(root) {

    3: L('Полная бластоциста: полость заполняет эмбрион', 'Толық бластоциста: қуыс эмбрионды толтырады', 'Full blastocyst: cavity fills the embryo'),
    4: L('Расширенная: объём увеличен, зона истончена', 'Кеңейген: көлемі ұлғайған, аймақ жұқарған', 'Expanded: volume larger, zona thinned'),
    5: L('Хетчинг: трофэктодерма выходит через зону', 'Хетчинг: трофэктодерма аймақтан шығуда', 'Hatching: trophectoderm herniating through the zona'),
    6: L('Вылупившаяся: полностью вне зоны', 'Шыққан: аймақтан толық шыққан', 'Hatched: fully out of the zona'),

  const TE = { A: L('много клеток, плотный эпителий', 'көп жасуша, тығыз эпителий', 'many cells, cohesive epithelium'), B: L('немного клеток, рыхлый эпителий', 'аздаған жасуша, бос эпителий', 'few cells, loose epithelium'), C: L('очень мало крупных клеток', 'өте аз ірі жасуша', 'very few large cells') };

    { id: 'e', type: 'range', min: 1, max: 6, value: 4, label: L('Степень расширения (1–6)', 'Кеңею дәрежесі (1–6)', 'Expansion stage (1–6)'), wide: true },
    { id: 'icm', type: 'seg', value: 'A', options: abc, label: L('Внутренняя клеточная масса', 'Ішкі жасушалық масса', 'Inner cell mass'), show: (v) => v.e >= 3 },
    { id: 'te', type: 'seg', value: 'A', options: abc, label: L('Трофэктодерма', 'Трофэктодерма', 'Trophectoderm'), show: (v) => v.e >= 3 },
  ], (v) => {

      : score === 2 ? L('Ориентир: средний приоритет; учитывайте день развития и морфокинетику.', 'Бағдар: орташа басымдық; даму күні мен морфокинетиканы ескеріңіз.', 'Guide: medium priority; consider development day and morphokinetics.')

    return [
      h('div', { class: 'bigs' }, big(tr(L('Грейд по Гарднеру', 'Гарднер грейді', 'Gardner grade')), early ? String(e) : `${e}${v.icm}${v.te}`), big(tr(L('Категория', 'Санат', 'Category')), tr(cat))),
      line(tr(L('Расширение', 'Кеңею', 'Expansion')) + ` ${e}`, tr(EXP[e])),
      !early && line(tr(L('ВКМ', 'ІЖМ', 'ICM')) + ` ${v.icm}`, tr(ICM[v.icm])),
      !early && line(tr(L('Трофэктодерма', 'Трофэктодерма', 'Trophectoderm')) + ` ${v.te}`, tr(TE[v.te])),

}


// ─── Загрузка нейросетей: ONNX Runtime Web + файлы моделей ─────────────────────
// На сайте всё берётся из соседних папок ort/ и models/.
// В полной офлайн-версии (BOPASI-full.html) рантайм и модели встроены в сам файл:
// <script type="application/x-gzip-base64" data-nn="имя"> — сжатые gzip и закодированные base64.
const BOPASI_NN = (() => {
  const base = () => (window.BOPASI_BASE || './');
  const el = (name) => document.querySelector(`script[data-nn="${name}"]`);
  const embedded = () => !!el('ort.wasm.min.js');
  const cache = new Map();
  // встроенный файл → байты (base64 → gzip → исходник)
  function unpack(name) {
    if (!cache.has(name)) cache.set(name, (async () => {
      const node = el(name); if (!node) throw new Error('нет встроенного файла ' + name);
      const gz = await (await fetch('data:application/octet-stream;base64,' + node.textContent.trim())).blob();
      return new Uint8Array(await new Response(gz.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    })());
    return cache.get(name);
  }
  const text = async (name) => new TextDecoder().decode(await unpack(name));
  let mjsUrl = null;
  // рантайм в окне win (сайт, офлайн-файл или iframe приложения)
  async function setup(win = window) {
    if (embedded()) {
      if (!win.ort) { const s = win.document.createElement('script'); s.textContent = await text('ort.wasm.min.js'); win.document.head.append(s); }
      mjsUrl ||= URL.createObjectURL(new Blob([await text('ort-wasm-simd-threaded.mjs')], { type: 'text/javascript' }));
      win.ort.env.wasm.wasmPaths = { mjs: mjsUrl };
      win.ort.env.wasm.wasmBinary = new win.Uint8Array(await unpack('ort-wasm-simd-threaded.wasm'));   // копия в «мир» окна (для iframe)
      win.ort.env.wasm.numThreads = 1;
      return win.ort;
    }
    if (location.protocol === 'file:') throw new Error('offline');
    if (!win.ort) await new Promise((res, rej) => { const s = win.document.createElement('script'); s.src = new URL(base() + 'ort/ort.wasm.min.js', location.href).href; s.onload = res; s.onerror = () => rej(new Error('ort')); win.document.head.append(s); });
    win.ort.env.wasm.wasmPaths = new URL(base() + 'ort/', location.href).href;
    win.ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
    return win.ort;
  }
  // байты модели с прогрессом загрузки
  async function bytes(name, onProgress) {
    if (embedded()) { const b = await unpack(name); onProgress?.(1); return b; }
    const r = await fetch(base() + 'models/' + name);
    if (!r.ok) throw new Error('model ' + r.status);
    const total = +r.headers.get('content-length') || 0, reader = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; onProgress?.(total ? got / total : 0); }
    const buf = new Uint8Array(got); let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; }
    return buf;
  }
  return { setup, bytes, embedded };
})();
if (typeof window !== 'undefined') window.BOPASI_NN = BOPASI_NN;


// ─── Нейросеть для SCD-теста: YOLOv8s-seg (сегментация клеток, 2 класса) ──────
// Модель: «Sperm chromatin dispersion microscopy image dataset for instance segmentation»
// (Ornelas Nande, Adel Domínguez, Mora Topete, Magdaleno Márquez, Aranguren, Valdivia-G, Sanchez; Zenodo, 2026, CC BY 4.0).
// Обучена на 2000 снимках, классы: 0 — фрагментирована, 1 — не фрагментирована. Архитектура YOLOv8 (Ultralytics, AGPL-3.0).
// Запуск в браузере через ONNX Runtime Web; файл модели и рантайм лежат рядом с сайтом (models/, ort/).
const SCD_AI = (() => {
  const SIZE = 1024, NC = 2, NM = 32, PROTO = 256;
  let session = null, loading = null;

  // рантайм и модель грузятся один раз, по первому требованию
  function load(onProgress) {
    if (session) return Promise.resolve(session);
    return (loading ||= (async () => {
      const ort = await BOPASI_NN.setup(window);
      const buf = await BOPASI_NN.bytes('scd-yolov8s-seg.onnx', onProgress);
      session = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
      return session;
    })().catch((e) => { loading = null; throw e; }));
  }

  // вписываем снимок в квадрат 1024 с серыми полями (как при обучении)
  function letterbox(canvas) {
    const W = canvas.width, H = canvas.height, k = Math.min(SIZE / W, SIZE / H);
    const nw = Math.round(W * k), nh = Math.round(H * k), px = Math.floor((SIZE - nw) / 2), py = Math.floor((SIZE - nh) / 2);
    const c = document.createElement('canvas'); c.width = c.height = SIZE;
    const g = c.getContext('2d', { willReadFrequently: true }); g.fillStyle = 'rgb(114,114,114)'; g.fillRect(0, 0, SIZE, SIZE);
    g.imageSmoothingQuality = 'high'; g.drawImage(canvas, px, py, nw, nh);
    const d = g.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE, x = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) { x[i] = d[i * 4] / 255; x[n + i] = d[i * 4 + 1] / 255; x[2 * n + i] = d[i * 4 + 2] / 255; }
    return { x, k, px, py };
  }
  // перекрытие рамок: IoU и доля меньшей рамки внутри большей (одна клетка, найденная дважды вдоль хвоста)
  const overlap = (a, b) => {
    const w = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)), h = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
    const i = w * h, A = (a.x2 - a.x1) * (a.y2 - a.y1), B = (b.x2 - b.x1) * (b.y2 - b.y1);
    return { iou: i / (A + B - i + 1e-9), ios: i / (Math.min(A, B) + 1e-9) };
  };

  // разбор выхода: рамки + классы + коэффициенты масок → клетки с маской, центром и эллипсом
  function decode(out0, out1, lb, W, H, conf, iouThr) {
    const N = out0.dims[2], P = out0.data, pr = out1.data, cand = [];
    for (let j = 0; j < N; j++) {
      let best = 0, cls = 0;
      for (let c = 0; c < NC; c++) { const s = P[(4 + c) * N + j]; if (s > best) { best = s; cls = c; } }
      if (best < conf) continue;
      const cx = P[j], cy = P[N + j], w = P[2 * N + j], h = P[3 * N + j];
      cand.push({ j, cls, score: best, x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2 });
    }
    cand.sort((a, b) => b.score - a.score);
    const keep = [];
    for (const c of cand) if (!keep.some((k) => { const o = overlap(k, c); return o.iou > iouThr || o.ios > 0.7; })) { keep.push(c); if (keep.length >= 300) break; }
    const s = PROTO / SIZE, cells = [];
    for (const d of keep) {
      const coef = new Float32Array(NM); for (let m = 0; m < NM; m++) coef[m] = P[(4 + NC + m) * N + d.j];
      const bx1 = Math.max(0, Math.floor(d.x1 * s)), by1 = Math.max(0, Math.floor(d.y1 * s)), bx2 = Math.min(PROTO - 1, Math.ceil(d.x2 * s)), by2 = Math.min(PROTO - 1, Math.ceil(d.y2 * s));
      let A = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0; const pts = [];
      for (let y = by1; y <= by2; y++) for (let x = bx1; x <= bx2; x++) {
        const px = x + 0.5, py = y + 0.5; if (px < d.x1 * s || px > d.x2 * s || py < d.y1 * s || py > d.y2 * s) continue;
        let v = 0; const o = y * PROTO + x; for (let m = 0; m < NM; m++) v += coef[m] * pr[m * PROTO * PROTO + o];
        if (v <= 0) continue;   // сигмоида > 0.5
        // координаты пикселя маски → координаты исходного снимка
        const ix = (px / s - lb.px) / lb.k, iy = (py / s - lb.py) / lb.k;
        A++; sx += ix; sy += iy; sxx += ix * ix; syy += iy * iy; sxy += ix * iy; pts.push(ix, iy);
      }
      const cx = ((d.x1 + d.x2) / 2 - lb.px) / lb.k, cy = ((d.y1 + d.y2) / 2 - lb.py) / lb.k;
      if (cx < 0 || cy < 0 || cx > W || cy > H) continue;
      const cell = { x: cx, y: cy, ai: d.cls === 0 ? 'frag' : 'ok', conf: d.score,
        box: [(d.x1 - lb.px) / lb.k, (d.y1 - lb.py) / lb.k, (d.x2 - lb.px) / lb.k, (d.y2 - lb.py) / lb.k] };
      if (A >= 3) {
        const mx = sx / A, my = sy / A, vxx = sxx / A - mx * mx, vyy = syy / A - my * my, vxy = sxy / A - mx * my;
        const tr2 = (vxx + vyy) / 2, dd = Math.sqrt(Math.max(0, tr2 * tr2 - (vxx * vyy - vxy * vxy)));
        Object.assign(cell, { x: mx, y: my, major: 4 * Math.sqrt(tr2 + dd), minor: 4 * Math.sqrt(Math.max(0, tr2 - dd)), angle: 0.5 * Math.atan2(2 * vxy, vxx - vyy), area: A / (s * s * lb.k * lb.k), mask: pts });
      } else {
        const bw = cell.box[2] - cell.box[0], bh = cell.box[3] - cell.box[1];
        Object.assign(cell, { major: Math.max(bw, bh), minor: Math.min(bw, bh), angle: bw >= bh ? 0 : Math.PI / 2, area: bw * bh * 0.78 });
      }
      cells.push(cell);
    }
    return cells;
  }

  async function detect(canvas, opt = {}) {
    const ses = await load(opt.onProgress);
    const lb = letterbox(canvas);
    const t0 = performance.now();
    const res = await ses.run({ [ses.inputNames[0]]: new window.ort.Tensor('float32', lb.x, [1, 3, SIZE, SIZE]) });
    const [o0, o1] = ses.outputNames.map((n) => res[n]);
    const cells = decode(o0, o1, lb, canvas.width, canvas.height, opt.conf ?? 0.1, opt.iou ?? 0.5);
    return { cells, ms: performance.now() - t0 };
  }

  // клетки нейросети → классы инструмента: «не фрагментирована» / «фрагментирована»
  function toCells(aiCells) {
    return aiCells.map((a) => ({ ...a, id: 'ai' + Math.round(a.x) + '_' + Math.round(a.y), cls: a.ai === 'frag' ? 'frag' : 'ok', halo: 0, weak: false, overlap: false }));
  }

  return { load, detect, toCells, ready: () => !!session };
})();

// ─── Нейросеть для SCD-теста ×20: CenterNet + ResNet-18 (центр ядра, малая ось, гало) ──
// Обучена на 130 полях SCD (объектив ×20, окраска Райт-Гимза, 3072×2048; CC BY 4.0), код BSD-3.
// Для каждого сперматозоида модель возвращает центр, малую ось головки и толщину гало;
// отношение гало / малая ось (Rhr) классифицируется по критериям Fernández.
// Запуск в браузере через ONNX Runtime Web, модель лежит рядом с сайтом (models/).
const SCD_AI20 = (() => {
  const IN = 512, PAD = 64, ST = IN - 2 * PAD, DOWN = 4, THR = 0.3, REF = 3072;
  let session = null, loading = null;
  function load(onProgress) {
    if (session) return Promise.resolve(session);
    return (loading ||= (async () => {
      const ort = await BOPASI_NN.setup(window);
      const buf = await BOPASI_NN.bytes('scd-centernet-r18.onnx', onProgress);
      session = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
      return session;
    })().catch((e) => { loading = null; throw e; }));
  }

  // классы Fernández по относительной толщине гало (гало / малая ось ядра)
  const classOf = (r) => (r >= 1 ? 'large' : r > 1 / 3 ? 'medium' : r > 0.05 ? 'small' : 'none');

  // canvas — исходный снимок; field — круг поля зрения (для снимков через окуляр) в координатах canvas.
  // Масштаб подбирается так, чтобы поле соответствовало кадру 3072 px, как при обучении.
  async function detect(canvas, opt = {}) {
    const ses = await load(opt.onProgress);
    const ort = window.ort;
    const fld = opt.field;
    // область анализа: поле зрения (окуляр) или весь кадр
    let ox = 0, oy = 0, ow = canvas.width, oh = canvas.height, k;
    if (fld) {
      ox = Math.max(0, Math.floor(fld.cx - fld.r)); oy = Math.max(0, Math.floor(fld.cy - fld.r));
      ow = Math.min(canvas.width, Math.ceil(fld.cx + fld.r)) - ox; oh = Math.min(canvas.height, Math.ceil(fld.cy + fld.r)) - oy;
      k = (REF * 0.9) / (2 * fld.r);
    } else k = REF / Math.max(ow, oh);
    k *= opt.scale || 1;
    const W = Math.round(ow * k), H = Math.round(oh * k);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingQuality = 'high';
    g.drawImage(canvas, ox, oy, ow, oh, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data;
    // серый — те же веса, что в исходном коде модели
    const gray = new Float32Array(W * H);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = Math.round(0.114 * d[p] + 0.587 * d[p + 1] + 0.2989 * d[p + 2]);
    const inField = fld ? (x, y) => Math.hypot(x / k + ox - fld.cx, y / k + oy - fld.cy) < fld.r * 0.98 : () => true;
    // сетка плиток 512 с перекрытием 64 и зеркальными полями
    const ch = Math.max(1, Math.ceil((W - 2 * PAD) / ST)), cv = Math.max(1, Math.ceil((H - 2 * PAD) / ST));
    let rw = ST * ch + 2 * PAD, rh = ST * cv + 2 * PAD;
    if ((rw - W) % 2) rw++; if ((rh - H) % 2) rh++;
    const pl = (rw - W) >> 1, pt = (rh - H) >> 1;
    const refl = (v, n) => { for (;;) { if (v < 0) v = -v - 1; else if (v >= n) v = 2 * n - v - 1; else return v; } };
    const tile = new Float32Array(IN * IN), dets = [];
    const t0 = performance.now(); let done = 0;
    for (let tx = 0; tx < ch; tx++) for (let ty = 0; ty < cv; ty++) {
      const x0 = tx * ST - pl, y0 = ty * ST - pt;
      // плитка целиком вне поля зрения — пропускаем
      if (fld) {
        const fx = (fld.cx - ox) * k, fy = (fld.cy - oy) * k, ix0 = x0 + PAD, iy0 = y0 + PAD;
        const dx = Math.max(ix0 - fx, 0, fx - (ix0 + ST)), dy = Math.max(iy0 - fy, 0, fy - (iy0 + ST));
        if (Math.hypot(dx, dy) > fld.r * k) { done++; continue; }
      }
      let s = 0, s2 = 0;
      for (let y = 0; y < IN; y++) { const yy = refl(y0 + y, H) * W; for (let x = 0; x < IN; x++) { const v = gray[yy + refl(x0 + x, W)]; tile[y * IN + x] = v; s += v; } }
      const m = s / tile.length; for (let i = 0; i < tile.length; i++) { const q = tile[i] - m; s2 += q * q; }
      const sd = Math.sqrt(s2 / tile.length) || 1; for (let i = 0; i < tile.length; i++) tile[i] = (tile[i] - m) / sd;
      const res = await ses.run({ [ses.inputNames[0]]: new ort.Tensor('float32', tile, [1, 1, IN, IN]) });
      const o = res[ses.outputNames[0]].data, K = res[ses.outputNames[0]].dims[2];
      const at = (r, i) => o[r * K + i];
      // строки выхода: 0 уверенность, 2 y, 3 x, 4–5 вектор большой оси, 6 малая ось, 7 поперечник с гало, 8–9 смещение
      for (let i = 0; i < K; i++) {
        const sc = at(0, i); if (sc <= THR) continue;
        const gx = at(3, i), gy = at(2, i);
        const lx = gx * DOWN + at(8, i), ly = gy * DOWN + at(9, i);
        // каждая клетка учитывается в той плитке, где её центр во внутренней зоне (без дублей на перекрытии)
        const lo = (t) => (t === 0 ? -1e9 : PAD), hi = (t, n) => (t === n - 1 ? 1e9 : IN - PAD);
        if (lx < lo(tx) || lx >= hi(tx, ch) || ly < lo(ty) || ly >= hi(ty, cv)) continue;
        const px = x0 + lx, py = y0 + ly;
        if (px < 0 || py < 0 || px >= W || py >= H || !inField(px, py)) continue;
        const minl = at(6, i) * DOWN, halo = at(7, i) * DOWN;
        if (minl <= 0) continue;
        dets.push({ px, py, sc, minl, halo, rhr: (halo - minl) / (2 * minl), maj: Math.hypot(at(4, i), at(5, i)) * DOWN, ang: Math.atan2(at(5, i), at(4, i)) });
      }
      done++; opt.onTile?.(done / (ch * cv));
    }
    // страховка от дублей: близкие центры (меньше малой оси) — оставляем более уверенный
    dets.sort((a, b) => b.sc - a.sc);
    const keep = [];
    for (const dd of dets) if (!keep.some((q) => Math.hypot(q.px - dd.px, q.py - dd.py) < Math.max(4, Math.min(q.minl, dd.minl) * 0.8))) keep.push(dd);
    const cells = keep.map((q) => {
      // выходы модели — полуоси (малая и большая), поэтому диаметры = ×2
      const minor = (2 * q.minl) / k, x = q.px / k + ox, y = q.py / k + oy;
      return { id: 'n20_' + Math.round(x) + '_' + Math.round(y), x, y, major: Math.max(minor, (2 * q.maj) / k), minor, angle: q.ang,
        halo: Math.max(0, q.rhr) * minor, rhr: q.rhr, conf: q.sc, cls: classOf(q.rhr), weak: false, overlap: false, area: Math.PI * minor * minor * 0.375 };
    });
    return { cells, ms: performance.now() - t0, tiles: ch * cv, k };
  }
  return { load, detect, classOf, ready: () => !!session };
})();

    });
    const q = (v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v);
    download('scd-dfi.csv', [head, ...rows].map((r) => r.map(q).join(',')).join('\n'), 'text/csv');
  }
  canvas.addEventListener('click', (e) => {
    const f = F(); if (!f || !f.res[st.method]) return;
    const r = f.res[st.method];
    const b = canvas.getBoundingClientRect(), x = (e.clientX - b.left) * (canvas.width / b.width), y = (e.clientY - b.top) * (canvas.height / b.height);
    let hit = null, hd = 1e9;
    for (const c of r.cells) { const d = Math.hypot(c.x - x, c.y - y); if (d < Math.max(10, c.major / 2 + 6) && d < hd) { hd = d; hit = c; } }
    if (st.addMode && !hit) {
      const m = r.M ? Math.sqrt(r.M / Math.PI) * 2 : 10;
      r.cells.push({ x, y, major: m * 1.4, minor: m, angle: 0, halo: 0, cls: st.addCls, manual: true });
    } else if (hit) {
      const ord = order().filter((k) => k === 'excluded' || kinds().includes(k)), i = ord.indexOf(hit.cls);
      hit.cls = ord[(i + 1) % ord.length];
    } else return;
    draw(); sync();
  });

  sync();
  return { destroy() { alive = false; } };
}

function fileToCanvasMax(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); resolve(c);
    };
    img.onerror = reject; img.src = URL.createObjectURL(file);
  });
}
