<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Результаты Magauiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Тот же язык, что у приложения Magauiya: бумага, фиолетовые «чернила» сетки Маклера, моноширинные числа.
   Сначала сводка, затем графики, таблица, проверка классификатора и условия съёмки. */
:root{
  --paper:#f5f5f8; --panel:#ffffff; --ink:#1c1a2b; --muted:#68657a; --line:#e2e0ea; --soft:#efedf6;
  --accent:#4a2f9e; --accent-ink:#ffffff; --accent-soft:#ebe6fb;
  --a:#2b8a3e; --b:#d99a00; --c:#1971c2; --d:#c2255c;
  --low:#c92a2a; --low-bg:#fff0f0; --ok:#2b8a3e; --ref:#3d3a52;
  --cat:#e9a15b; --cat-dark:#b9692c; --cat-belly:#fbe3c4; --scope:#3d3a52; --scope-light:#8f8ba8;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --panel:#1b1a25; --ink:#ecebf4; --muted:#a19eb4; --line:#2e2c3c; --soft:#22202e;
  --accent:#a48cff; --accent-ink:#17142a; --accent-soft:#2a2445;
  --a:#0c8a63; --b:#c98500; --c:#3987e5; --d:#d55181;
  --low:#ff8787; --low-bg:#3a1f25; --ok:#69db7c; --ref:#c9c5e0; --scope:#c9c5e0; --scope-light:#7d7998; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121119; --panel:#1b1a25; --ink:#ecebf4; --muted:#a19eb4; --line:#2e2c3c; --soft:#22202e;
  --accent:#a48cff; --accent-ink:#17142a; --accent-soft:#2a2445;
  --a:#0c8a63; --b:#c98500; --c:#3987e5; --d:#d55181;
  --low:#ff8787; --low-bg:#3a1f25; --ok:#69db7c; --ref:#c9c5e0; --scope:#c9c5e0; --scope-light:#7d7998; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--f-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{width:84px;height:70px;flex:none}
.brand h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.3px;line-height:1.15;text-wrap:balance}
.brand h1 .ver{display:block;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13.5px;flex:1 1 320px;min-width:0}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.langs button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--panel);color:var(--muted);padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:15.5px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.card .lead{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:75ch}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .v{font-family:var(--f-num);font-size:28px;font-weight:500;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.tile .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted)}
.chart .reft{fill:var(--ref);font-size:10.5px}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;margin-top:8px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.45;padding:7px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;z-index:3}
.tip b{font-family:var(--f-num);font-weight:500}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
thead th{font-size:11.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
th button[aria-sort]::after{content:" ↕";opacity:.5}
th button[aria-sort="ascending"]::after{content:" ↑";opacity:1}
th button[aria-sort="descending"]::after{content:" ↓";opacity:1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
td.low{color:var(--low);background:var(--low-bg);font-weight:600}
.flag{display:inline-block;font-family:var(--f-ui);font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--low-bg);color:var(--low);margin-left:4px}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmp .box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.cmp .box h3{font-size:13.5px;margin:0 0 8px;font-weight:600}
.cmp dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-size:13px}
.cmp dt{color:var(--muted)} .cmp dd{margin:0;font-family:var(--f-num)}
.meth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.meth{grid-template-columns:minmax(0,1fr)}}
.meth dl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}
.meth dt{color:var(--muted)} .meth dd{margin:0}
ul.lim{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
footer{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
footer .mail{font-family:var(--f-num);color:var(--ink);user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  meth:[['Санау камерасы','Makler (Sperm Processor, Үндістан), тереңдігі 10 мкм, 100 мкм шаршылардан 10 × 10 тор'],['Микроскоп','Olympus CX43 (Olympus Corporation, Жапония)'],['Камера','ToupCam XCAM1080PHB (Қытай), 1920 × 1080'],['Кадр жиілігі','нақты ≈ 25 кадр/с (айнымалы; контейнерде 29,97); s40 үлгісі — 12,5 кадр/с'],['Масштаб','тор қадамы бойынша: 306 px = 100 мкм (0,327 мкм/px)'],['Детекция','black-hat / top-hat, 21 px эллипс, шек 25, ауданы 40–700 px'],['Трекинг','венгр алгоритмі, 7,5 мкм/кадр, 2 кадрға дейін өткізу, трек ≥ 0,5 с'],['ДДҰ-6 кластары','1 с ішіндегі алға жылжу жылдамдығы: a ≥ 25 мкм/с, b 5–25, c — алға жылжусыз қозғалыс, d — қозғалыс жоқ'],['Концентрация','үстел жылжымаған кадрлар (әр 3-ші), қабат көлемі = аудан × 10 мкм'],['Жіктеуіш','градиенттік бустинг, 200 ағаш, 110 белгі, шек 0,5']],
  lim:['Зертханашының қолмен санауымен салыстыру жоқ — концентрация мен қозғалғыштықтың дәлдігі әлі бағаланбаған.','«Бас / қоқыс» белгілеуін бір адам жасады; оны маман тексеруі керек.','≈ 25 кадр/с — CASA үшін ұсынылған 50–60-тан төмен; VCL, ALH және BCF төмендетілген.','Жазу кезіндегі температура белгісіз; a класының 25 мкм/с шегі 37 °C үшін анықталған.','Бірқатар үлгілерде c класы 40%-дан жоғары; қолмен бағаламай, мұны трекинг қателерінен ажырату мүмкін емес.','Бір көру өрісі бар үлгілерде сенім аралығы жоқ.'],
  disclaimer:'Зерттеу құралы, медициналық бұйым емес.',
 }
};
let L = 'ru';
try { const s = localStorage.getItem('magauiya-lang'); if (s && I[s]) L = s; } catch (_) {}
const t = k => I[L][k];
const fmt = (v, nd = 1) => v == null || !isFinite(v) ? '—' : (L === 'en' ? v.toFixed(nd) : v.toFixed(nd).replace('.', ','));
const pct = p => p == null ? '—' : p < 0 ? '<2,5'.replace(',', L === 'en' ? '.' : ',') : p > 100 ? '>97,5'.replace(',', L === 'en' ? '.' : ',') : String(Math.round(p));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const quant = (a, q) => { const s = [...a].sort((x, y) => x - y); const i = (s.length - 1) * q, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); };

function tip(box, html, x, y) {
  let tp = box.querySelector('.tip'); if (!tp) { tp = document.createElement('div'); tp.className = 'tip'; box.appendChild(tp); }
  if (html == null) { tp.hidden = true; return; }
  tp.hidden = false; tp.innerHTML = html;
  const w = box.clientWidth; tp.style.left = Math.min(Math.max(x, 70), w - 70) + 'px'; tp.style.top = y + 'px';
}

function tiles() {
  const c = R.map(r => r.c);
  const ev = D.ev;
  const T = [
    [String(R.length), t('tN'), t('tNk')],
    [fmt(quant(c, .5), 0), t('tMed'), t('tMedk')(fmt(quant(c, .25), 0), fmt(quant(c, .75), 0))],
    [String(R.filter(r => r.c < 16).length) + ` <small>/ ${R.length}</small>`, t('tLowC'), t('tLowCk')],
    [String(R.filter(r => r.pr < 30).length) + ` <small>/ ${R.length}</small>`, t('tLowPR'), t('tLowPRk')],
    [fmt(ev.v1_1_cv_new.accuracy * 100, 1) + ' <small>%</small>', t('tAcc'), t('tAcck')(fmt(ev.v1_on_new_videos.accuracy * 100, 1))],
  ];
  document.getElementById('tiles').innerHTML = T.map(([v, k, s]) => `<div class="tile"><div class="v">${v}</div><div class="k"><b>${k}</b><br>${s}</div></div>`).join('');
}

function chartConc() {
  const box = document.getElementById('chConc'); box.innerHTML = '';
  const W = 560, H = 300, m = { l: 44, r: 12, t: 12, b: 22 };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t('hConc') }, box);
  const S = [...R].sort((a, b) => a.c - b.c);
  const y = v => m.t + (H - m.t - m.b) * (1 - (Math.log10(v) - Math.log10(2)) / (Math.log10(400) - Math.log10(2)));
  const x = i => m.l + (W - m.l - m.r) * (i + .5) / S.length;
  for (const v of [2, 5, 10, 20, 50, 100, 200]) {
    el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }, svg);
    const tx = el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg); tx.textContent = v;
  }
  el('line', { x1: m.l, x2: W - m.r, y1: y(16), y2: y(16), stroke: 'var(--ref)', 'stroke-width': 1.2, 'stroke-dasharray': '4 3' }, svg);
  const lt = el('text', { x: W - m.r, y: y(16) - 5, 'text-anchor': 'end', class: 'reft' }, svg); lt.textContent = t('lim16');
  S.forEach((r, i) => {
    if (r.lo != null && r.hi != null) el('line', { x1: x(i), x2: x(i), y1: y(Math.max(2, r.lo)), y2: y(Math.min(400, r.hi)), stroke: 'var(--muted)', 'stroke-width': 1.2, 'stroke-linecap': 'round' }, svg);
    el('circle', { cx: x(i), cy: y(r.c), r: 4, fill: r.c < 16 ? 'var(--low)' : 'var(--accent)', stroke: 'var(--panel)', 'stroke-width': 2 }, svg);
    const hit = el('rect', { x: x(i) - (W - m.l - m.r) / S.length / 2, y: m.t, width: (W - m.l - m.r) / S.length, height: H - m.t - m.b, fill: 'transparent' }, svg);
    hit.addEventListener('pointerenter', () => { const bb = box.getBoundingClientRect(), sc = bb.width / W;
      tip(box, `<b>${r.id}</b> · ${fmt(r.c)} ${L === 'en' ? 'M/mL' : 'млн/мл'}<br>95%: ${fmt(r.lo)}–${fmt(r.hi)}`, x(i) * sc, y(r.c) * sc); });
    hit.addEventListener('pointerleave', () => tip(box, null));
  });
  const ax = el('text', { x: m.l, y: H - 4 }, svg); ax.textContent = L === 'en' ? 'samples, ascending →' : L === 'kz' ? 'үлгілер, өсу ретімен →' : 'образцы по возрастанию →';
}

function chartMot() {
  const box = document.getElementById('chMot'); box.innerHTML = '';
  const W = 560, H = 300, m = { l: 34, r: 12, t: 12, b: 22 };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t('hMot') }, box);
  const S = [...R].sort((a, b) => a.pr - b.pr);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / 100);
  const bw = (W - m.l - m.r) / S.length;
  for (const v of [0, 25, 50, 75, 100]) { const tx = el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg); tx.textContent = v; }
  S.forEach((r, i) => {
    let acc = 0; const x0 = m.l + i * bw + 1;
    for (const [k, col] of [['a', '--a'], ['b', '--b'], ['cc', '--c'], ['d', '--d']]) {
      const v = r[k] || 0; if (v <= 0) continue;
      el('rect', { x: x0, y: y(acc + v), width: Math.max(1, bw - 2), height: Math.max(0, y(acc) - y(acc + v) - (acc > 0 ? 1 : 0)), fill: `var(${col})`, rx: 1.5 }, svg);
      acc += v;
    }
    const hit = el('rect', { x: m.l + i * bw, y: m.t, width: bw, height: H - m.t - m.b, fill: 'transparent' }, svg);
    hit.addEventListener('pointerenter', () => { const bb = box.getBoundingClientRect(), sc = bb.width / W;
      tip(box, `<b>${r.id}</b> · PR ${fmt(r.pr, 0)}%<br>a ${fmt(r.a, 0)} · b ${fmt(r.b, 0)} · c ${fmt(r.cc, 0)} · d ${fmt(r.d, 0)}`, (m.l + (i + .5) * bw) * sc, m.t * sc + 20); });
    hit.addEventListener('pointerleave', () => tip(box, null));
  });
  el('line', { x1: m.l, x2: W - m.r, y1: y(30), y2: y(30), stroke: 'var(--ink)', 'stroke-width': 1.2, 'stroke-dasharray': '4 3' }, svg);
  const lt = el('text', { x: m.l + 4, y: y(30) - 5, class: 'reft' }, svg); lt.textContent = t('lim30');
  document.getElementById('keys').innerHTML = [['a', '--a'], ['b', '--b'], ['c', '--c'], ['d', '--d']].map(([k, c]) => `<span><i style="background:var(${c})"></i>${t(k)}</span>`).join('');
}

let sortKey = 'id', sortDir = 1;
function table() {
  const C = t('cols');
  const cols = [['id', 0], ['fps', 1], ['fields', 0], ['c', 1], ['ci', -1], ['pc', 0], ['a', 0], ['b', 0], ['cc', 0], ['d', 0], ['pr', 0], ['ppr', 0], ['tm', 0], ['vcl', 1], ['vsl', 1], ['lin', 2], ['deb', 0]];
  const th = cols.map(([k]) => `<th class="${k === 'id' ? '' : 'num'}">${k === 'ci' ? C[k] : `<button id="s-${k}" data-k="${k}" aria-sort="${sortKey === k ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}">${C[k]}</button>`}</th>`).join('');
  document.querySelector('#tab thead').innerHTML = `<tr>${th}</tr>`;
  const S = [...R].sort((a, b) => { const va = a[sortKey], vb = b[sortKey]; if (va == null) return 1; if (vb == null) return -1; return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir; });
  document.querySelector('#tab tbody').innerHTML = S.map(r => {
    const low = (p) => p != null && p < 5 ? ' low' : '';
    const flags = (r.fps < 20 ? `<span class="flag">${t('fLowFps')}</span>` : '') + (r.fields < 2 ? `<span class="flag">${t('fOneField')}</span>` : '');
    return `<tr><td><b>${r.id}</b>${flags}</td><td class="num">${fmt(r.fps)}</td><td class="num">${r.fields}</td>
      <td class="num${low(r.pc)}">${fmt(r.c)}</td><td class="num">${r.lo == null ? '—' : fmt(r.lo) + '–' + fmt(r.hi)}</td><td class="num">${pct(r.pc)}</td>
      <td class="num">${fmt(r.a, 0)}</td><td class="num">${fmt(r.b, 0)}</td><td class="num">${fmt(r.cc, 0)}</td><td class="num">${fmt(r.d, 0)}</td>
      <td class="num${low(r.ppr)}">${fmt(r.pr, 0)}</td><td class="num">${pct(r.ppr)}</td><td class="num${low(r.ptm)}">${fmt(r.tm, 0)}</td>
      <td class="num">${fmt(r.vcl)}</td><td class="num">${fmt(r.vsl)}</td><td class="num">${fmt(r.lin, 2)}</td><td class="num">${fmt(r.deb, 0)}%</td></tr>`;
  }).join('');
  document.querySelectorAll('#tab th button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; } table();
  }));
}

function clf() {
  const ev = D.ev;
  const box = (h, e) => `<div class="box"><h3>${h}</h3><dl>
    <dt>${t('acc')}</dt><dd>${fmt(e.accuracy * 100)}%</dd><dt>${t('auc')}</dt><dd>${fmt(e.auc, 3)}</dd>
    <dt>${t('sens')}</dt><dd>${fmt(e.sensitivity * 100)}%</dd><dt>${t('spec')}</dt><dd>${fmt(e.specificity * 100)}%</dd>
    <dt>${t('mae')}</dt><dd>${fmt(e.head_fraction_mae_pp)}</dd><dt>${t('n')}</dt><dd>${e.n} / ${e.n_videos}</dd></dl></div>`;
  document.getElementById('cmp').innerHTML = box(t('b1'), ev.v1_on_new_videos) + box(t('b2'), ev.v1_1_cv_all) + box(t('b3'), ev.v1_1_cv_new);
}

function render() {
  document.documentElement.lang = L === 'kz' ? 'kk' : L;
  document.querySelectorAll('[data-i]').forEach(e => { const v = t(e.dataset.i); if (typeof v === 'string') e.textContent = v; });
  document.querySelector('[data-i="noteClf"]').textContent = t('noteClf')(D.ev.counts);
  document.getElementById('meth').innerHTML = t('meth').map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('lim').innerHTML = t('lim').map(v => `<li>${v}</li>`).join('');
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === L)));
  tiles(); chartConc(); chartMot(); table(); clf();
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { L = b.dataset.l; try { localStorage.setItem('magauiya-lang', L); } catch (_) {} render(); }));
render();
})();
</script>

</body></html>
