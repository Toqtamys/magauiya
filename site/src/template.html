<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOPASI — открытые ИИ-инструменты репродуктивной медицины</title>
<meta name="description" content="BOPASI: спермограмма по видео, индекс фрагментации ДНК, перевод RC ⇄ фазовый контраст, грейдинг бластоцист, калькуляторы ВРТ и 3D-конструктор препаратов. Всё работает в браузере.">
<meta name="theme-color" content="#06123a">
<meta property="og:title" content="BOPASI">
<meta property="og:description" content="Открытые ИИ-инструменты репродуктивной медицины — прямо в браузере.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2306123a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2338c6f4' stroke-width='2'/%3E%3Ccircle cx='13' cy='14' r='3.2' fill='%23fff'/%3E%3Ccircle cx='19' cy='13.5' r='2.8' fill='%23fff'/%3E%3Ccircle cx='15' cy='19.5' r='2.7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;600;700&display=swap">
<style>{{CSS}}</style>
</head>
<body class="intro">
<canvas id="scene" aria-hidden="true"></canvas>

<div id="ui">
  <header class="top">
    <a id="logo" href="#" aria-label="BOPASI">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="word">BOPASI</span>
      <small id="tagline"></small>
    </a>
    <nav class="top-r">
      <button id="btnAll" class="tb"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg><span class="lbl"></span></button>
      <button id="btnAbout" class="tb"></button>
      <div id="langs" class="langs" role="group" aria-label="Language"></div>
      <button id="sound" class="snd" aria-pressed="false"><span class="play" aria-hidden="true"></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
    </nav>
  </header>

  <section id="intro">
    <h1 id="introTitle"></h1>
    <p id="introLead"></p>
    <div class="intro-cta">
      <button id="startBtn" class="btn-big"></button>
      <span class="scroll"><i></i><span id="scrollHint"></span></span>
    </div>
  </section>

  <section id="card" aria-live="polite">
    <div id="cardEyebrow" class="eyebrow"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <div class="card-cta">
      <button id="cardOpen" class="btn-big"></button>
      <span class="badge"><i></i><span id="cardBadge"></span></span>
    </div>
  </section>

  <nav id="timeline" aria-label="Chapters"></nav>
  <p id="nowebgl" class="nowebgl"></p>
</div>

<div id="panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="pTitle" tabindex="-1">
  <div class="p-head"><button id="pBack" class="p-back" data-close></button></div>
  <div class="p-wrap">
    <div id="pEyebrow" class="eyebrow dark"></div>
    <h1 id="pTitle"></h1>
    <p id="pLead" class="p-lead"></p>
    <p id="pNote" class="p-note"></p>
    <div id="toolMount" class="tool-mount"></div>
    <div id="pInfo" class="p-info"></div>
    <nav id="pNav" class="p-nav"></nav>
    <p id="pDisc" class="p-disc"></p>
  </div>
</div>

<div id="overlay-all" class="ov" hidden>
  <div class="ov-inner" tabindex="-1">
    <button class="ov-close" data-close aria-label="Close">×</button>
    <div class="ov-head"><h2 id="indexTitle"></h2><span id="indexCount"></span></div>
    <div id="indexList"></div>
  </div>
</div>
<div id="overlay-about" class="ov" hidden>
  <div class="ov-inner" tabindex="-1">
    <button class="ov-close" data-close aria-label="Close">×</button>
    <h2 id="aboutTitle"></h2>
    <div id="aboutBody"></div>
  </div>
</div>

<script type="module">
{{JS}}
</script>
</body>
</html>
